<svg xmlns="http://www.w3.org/2000/svg" width="800" height="334" viewBox="0 0 800 334" role="img" aria-labelledby="title desc">
  <title id="title">Published base Bonsai 2 generation speed</title>
  <desc id="desc">PQ2 weights, tokens per second, higher is faster. Apple M5 Pro with Metal: 28.1. RTX 4090: 81.2. RTX 5090: 129.9. Publisher llama-bench TG128 results, batch 1, depth 0, no vision. These are not Swift or Snapdragon measurements. The axis starts at zero.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }
    .card {
      fill: #248365;
      fill-opacity: 0.06;
      stroke: #248365;
      stroke-opacity: 0.22;
      stroke-width: 1.5;
    }
    .title, .value {
      fill: #163c32;
    }
    .subtitle, .footnote {
      fill: #486359;
    }
    .label {
      fill: #243d34;
    }
    .axis {
      fill: #526d63;
    }
    .baseline {
      stroke: #248365;
      stroke-opacity: 0.28;
    }
    .grid {
      stroke: #248365;
      stroke-opacity: 0.16;
    }
    .bar-primary {
      fill: #248365;
    }
    @media (prefers-color-scheme: dark) {
      .card {
        fill: #2ea881;
        fill-opacity: 0.08;
        stroke: #52b795;
        stroke-opacity: 0.25;
      }
      .title, .value {
        fill: #e6f4ef;
      }
      .subtitle, .footnote {
        fill: #96b5a9;
      }
      .label {
        fill: #cde2da;
      }
      .axis {
        fill: #89a89c;
      }
      .baseline {
        stroke: #66c2a3;
        stroke-opacity: 0.32;
      }
      .grid {
        stroke: #66c2a3;
        stroke-opacity: 0.18;
      }
      .bar-primary {
        fill: #2ea881;
      }
    }
  </style>
  <rect class="card" x="0.75" y="0.75" width="798.5" height="332.5" rx="15.25" fill="#248365" fill-opacity="0.06" stroke="#248365" stroke-opacity="0.22" stroke-width="1.5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text class="title" x="28" y="38" font-size="21" font-weight="700" fill="#367a63">Generation speed · published hardware reference</text>
    <text class="subtitle" x="28" y="63" font-size="14" fill="#527d6d">Base Bonsai 2 · PQ2 · tokens/second · higher is faster</text>
    <g fill="none" stroke-width="1">
      <path class="baseline" d="M232 86V262" stroke="#248365" stroke-opacity="0.28"/>
      <path class="grid" d="M377.7 86V262 M523.4 86V262 M669.1 86V262" stroke="#248365" stroke-opacity="0.16"/>
    </g>
    <g class="label" font-size="15" fill="#3d7562">
      <text x="28" y="122">Apple M5 Pro / Metal</text>
      <text x="28" y="182">RTX 4090</text>
      <text x="28" y="242">RTX 5090</text>
    </g>
    <g class="bar-primary" fill="#289471">
      <rect x="232" y="100" width="102.36" height="32" rx="5"/>
      <rect x="232" y="160" width="295.8" height="32" rx="5"/>
      <rect x="232" y="220" width="473.21" height="32" rx="5"/>
    </g>
    <g class="value" font-size="16" font-weight="700" fill="#367a63">
      <text x="345" y="122">28.1</text>
      <text x="539" y="182">81.2</text>
      <text x="716" y="242">129.9</text>
    </g>
    <g class="axis" font-size="12" fill="#5c8274" text-anchor="middle">
      <text x="232" y="280">0</text><text x="377.7" y="280">40</text>
      <text x="523.4" y="280">80</text><text x="669.1" y="280">120</text>
    </g>
    <text class="footnote" x="28" y="313" font-size="12" fill="#527d6d">Source: Prism ML · llama-bench TG128 · not a Swift / Snapdragon forecast</text>
  </g>
</svg>
