<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" role="img" aria-labelledby="title desc">
  <title id="title">Published answer-quality benchmark comparison</title>
  <desc id="desc">Average across 14 thinking-mode benchmarks, higher is better. Qwen3.8-27B FP16: 86.32. Qwen UD-Q4_K_XL: 85.18. Base Bonsai 2: 84.78. Qwen IQ2_XXS: 72.59. Publisher EvalScope and vLLM results on H100, including vision. Base Bonsai is not Swift. Scores do not measure creative writing. The axis starts at zero and ends at 100.</desc>
  <style>
    :root {
      color-scheme: light dark;
    }
    .card {
      fill: #248365;
      fill-opacity: 0.06;
      stroke: #248365;
      stroke-opacity: 0.22;
      stroke-width: 1.5;
    }
    .title, .value, .label-strong {
      fill: #163c32;
    }
    .subtitle, .footnote {
      fill: #486359;
    }
    .label {
      fill: #243d34;
    }
    .axis {
      fill: #526d63;
    }
    .baseline {
      stroke: #248365;
      stroke-opacity: 0.28;
    }
    .grid {
      stroke: #248365;
      stroke-opacity: 0.16;
    }
    .bar-primary {
      fill: #248365;
    }
    .bar-secondary {
      fill: #738e84;
    }
    @media (prefers-color-scheme: dark) {
      .card {
        fill: #2ea881;
        fill-opacity: 0.08;
        stroke: #52b795;
        stroke-opacity: 0.25;
      }
      .title, .value, .label-strong {
        fill: #e6f4ef;
      }
      .subtitle, .footnote {
        fill: #96b5a9;
      }
      .label {
        fill: #cde2da;
      }
      .axis {
        fill: #89a89c;
      }
      .baseline {
        stroke: #66c2a3;
        stroke-opacity: 0.32;
      }
      .grid {
        stroke: #66c2a3;
        stroke-opacity: 0.18;
      }
      .bar-primary {
        fill: #2ea881;
      }
      .bar-secondary {
        fill: #5e7a70;
      }
    }
  </style>
  <rect class="card" x="0.75" y="0.75" width="798.5" height="384.5" rx="15.25" fill="#248365" fill-opacity="0.06" stroke="#248365" stroke-opacity="0.22" stroke-width="1.5"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text class="title" x="28" y="38" font-size="21" font-weight="700" fill="#367a63">Answer quality · published benchmark average</text>
    <text class="subtitle" x="28" y="63" font-size="14" fill="#527d6d">Qwen3.8-27B family · 14 thinking-mode benchmarks · higher is better</text>
    <g fill="none" stroke-width="1">
      <path class="baseline" d="M232 86V316" stroke="#248365" stroke-opacity="0.28"/>
      <path class="grid" d="M352 86V316 M472 86V316 M592 86V316 M712 86V316" stroke="#248365" stroke-opacity="0.16"/>
    </g>
    <g class="label" font-size="15" fill="#3d7562">
      <text x="28" y="122">Qwen · FP16</text>
      <text x="28" y="182">Qwen · UD-Q4_K_XL</text>
      <text class="label-strong" x="28" y="242" font-weight="700" fill="#367a63">Base Bonsai 2</text>
      <text x="28" y="302">Qwen · IQ2_XXS</text>
    </g>
    <g class="bar-secondary" fill="#6b857b">
      <rect x="232" y="100" width="414.336" height="32" rx="5"/>
      <rect x="232" y="160" width="408.864" height="32" rx="5"/>
      <rect x="232" y="280" width="348.432" height="32" rx="5"/>
    </g>
    <rect class="bar-primary" x="232" y="220" width="406.944" height="32" rx="5" fill="#289471"/>
    <g class="value" font-size="16" font-weight="700" fill="#367a63">
      <text x="657" y="122">86.32</text><text x="652" y="182">85.18</text>
      <text x="650" y="242">84.78</text><text x="592" y="302">72.59</text>
    </g>
    <g class="axis" font-size="12" fill="#5c8274" text-anchor="middle">
      <text x="232" y="336">0</text><text x="352" y="336">25</text>
      <text x="472" y="336">50</text><text x="592" y="336">75</text><text x="712" y="336">100</text>
    </g>
    <text class="footnote" x="28" y="367" font-size="12" fill="#527d6d">Source: Prism ML · base-model scores, not Swift or creative-writing results</text>
  </g>
</svg>
