[package]
name = "bonsai-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded development chat transport and request supervision for the Bonsai broker"

[features]
# Compatibility marker; native inference always uses the pinned external server.
native-swift = []
# Qualification only; ordinary request parsing remains on serde_json.
json-candidate = ["dep:simd-json"]

[[bin]]
name = "bonsai-broker"
path = "src/main.rs"
# CLI behavior is covered by integration tests; this root has no unit tests.
test = false

[dependencies]
bonsai-artifacts.workspace = true
bonsai-cpu-policy.workspace = true
http = "=1.5.0"
httparse.workspace = true
memchr.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
simd-json = { version = "=0.19.0", optional = true }
subtle.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
bonsai-windows-process.workspace = true
bonsai-windows-credentials.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
