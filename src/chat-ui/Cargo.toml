[package]
name = "bonsai-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["chat", "windows", "native", "llm", "rust"]
categories = ["gui"]
description = "Native Rust desktop chat for the local Swift Bonsai 2 broker"

[dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
httparse.workspace = true
memchr.workspace = true

[target.'cfg(windows)'.dependencies]
bonsai-audio.workspace = true
sha2.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu_no_default_features"] }
# Select all supported Windows backends explicitly for eframe's shared renderer.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "gles", "wgsl"] }
bonsai-windows-credentials.workspace = true
bonsai-windows-process.workspace = true
raw-window-handle = "=0.6.2"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Ole"] }
windows = { version = "=0.62.2", features = ["Win32_System_WinRT", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Foundation", "Media_Capture", "Media_MediaProperties", "Storage_Streams", "Storage", "Security_Authorization_AppCapabilityAccess"] }
# COM implementation macros refer directly to windows_core; match windows above.
windows-core = "=0.62.2"
# Match the asynchronous types returned by windows 0.62.2; 0.100 is incompatible.
windows-future = "=0.3.2"

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
egui_system_font_provider = "=0.37.0"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[lints]
workspace = true
