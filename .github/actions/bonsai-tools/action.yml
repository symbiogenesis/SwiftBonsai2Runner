name: Reuse packaged Bonsai tools
description: Reuse an exact native Windows ARM64 CLI; build it only when its inputs change.
inputs:
  github-release:
    description: Use GitHub's execution cap only in the hosted Windows Release workflow.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select the exact packaged CLI identity and external paths
      shell: pwsh
      working-directory: ${{ runner.temp }}
      env:
        TOOLS_SOURCE_ID: ${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'tools/bonsai/**', 'tools/native-reference/reference_numerics.rs', 'src/audio/**', 'src/artifacts/**', 'src/cpu-policy/**', 'src/windows-*/**', 'src/speech-asr/model.lock.json', 'src/speech-tts/model*.lock.json', 'tools/canary-asr/**', 'tools/qwen-tts/**', 'tools/hexagon/diagnostic.manifest', 'src/chat-ui/assets/bonsai.ico', 'LICENSE', 'NOTICE', '.cargo/**', 'rust-toolchain.toml', 'tools/ci/**', '.github/actions/ci-tool/**', '.github/actions/rust-toolchain/**', 'config/**', '.github/actions/bonsai-tools/action.yml') }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Packaged tools require native Windows ARM64.' }
        if ($env:TOOLS_SOURCE_ID -cnotmatch '^[a-f0-9]{64}$') { throw 'An exact source identity is required.' }
        if ($env:RUNNER_ENVIRONMENT -ceq 'github-hosted' -and (-not $env:ImageOS -or -not $env:ImageVersion)) { throw 'Hosted executable caching requires the runner image identity.' }
        # Compiler/profile overrides and Cargo-home configuration are build
        # inputs too. The explicit target directory and forced content mode do
        # not change compiled bytes, so they do not partition executable reuse.
        $buildInputs = @(Get-ChildItem Env: | ForEach-Object { [pscustomobject]@{ Name = $_.Name.ToUpperInvariant(); Value = $_.Value } } | Where-Object { $_.Name -cnotin @('CARGO_BUILD_FINGERPRINT', 'CARGO_TARGET_DIR') -and $_.Name -cmatch '^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|RUSTC(?:_.*)?|CARGO_INCREMENTAL|CARGO_BUILD_.*|CARGO_PROFILE_RELEASE_.*|CARGO_TARGET_.*)$' } | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" })
        $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
        foreach ($name in @('config', 'config.toml')) {
          $config = Join-Path $cargoHome $name
          $digest = if (Test-Path -LiteralPath $config -PathType Leaf) { (Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant() } else { 'absent' }
          $buildInputs += "cargo-home-$name=$digest"
        }
        $environmentId = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($buildInputs -join "`n")))).ToLowerInvariant()
        "BONSAI_TOOLS_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)-$environmentId" >> $env:GITHUB_ENV
        "BONSAI_TOOLS_SOURCE_ID=$env:TOOLS_SOURCE_ID" >> $env:GITHUB_ENV
        "BONSAI_TOOLS_TARGET=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PackagedTools')" >> $env:GITHUB_ENV
        "BONSAI_TOOLS_PACKAGE=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PackagedToolsBin')" >> $env:GITHUB_ENV
        $buildId = [guid]::NewGuid().ToString('N')
        "BONSAI_TOOLS_BUILD_ID=$buildId" >> $env:GITHUB_ENV
        "BONSAI_TOOLS_BUILD_EVIDENCE=$(Join-Path $env:RUNNER_TEMP ('SwiftBonsai-ToolsBuild-' + $buildId))" >> $env:GITHUB_ENV
    - name: Reuse only the exact packaged CLI and its digest receipt
      id: executable-cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.BONSAI_TOOLS_PACKAGE }}
        # No fallback keys: skipping compilation requires identical build inputs.
        key: bonsai-tools-executable-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.BONSAI_TOOLS_CACHE_HOST }}-nightly-2026-11-12-${{ env.BONSAI_TOOLS_SOURCE_ID }}
    - name: Reuse the pinned native Rust compiler when compilation is needed
      if: steps.executable-cache.outputs.cache-hit != 'true'
      uses: $/.github/actions/rust-toolchain
      with:
        toolchain: nightly-2026-11-12-aarch64-pc-windows-msvc
    - name: Reuse Cargo downloads and native tool build artifacts
      if: steps.executable-cache.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ${{ env.BONSAI_TOOLS_TARGET }}
        key: bonsai-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BONSAI_TOOLS_CACHE_HOST }}-nightly-2026-11-12-${{ env.BONSAI_TOOLS_SOURCE_ID }}-content-v1
        restore-keys: |
          bonsai-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BONSAI_TOOLS_CACHE_HOST }}-nightly-2026-11-12-
    - uses: $/.github/actions/ci-tool
      if: steps.executable-cache.outputs.cache-hit != 'true'
    - name: Build the packaged CLI after build inputs change
      if: steps.executable-cache.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: ${{ runner.temp }}
      env:
        # Restored sources get new timestamps; fingerprints must follow content.
        CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
        CARGO_BUILD_FINGERPRINT: content
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        GITHUB_RELEASE_BUILD: ${{ inputs.github-release }}
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $deadlineArguments = @(if ($env:GITHUB_RELEASE_BUILD -ceq 'true') { '--github-release' })
        & $env:BONSAI_CI_PATH rust-check --root $env:GITHUB_WORKSPACE --package bonsai-tools --phase build --target $env:BONSAI_TOOLS_TARGET --evidence $env:BONSAI_TOOLS_BUILD_EVIDENCE @deadlineArguments
        $builtTool = Join-Path $env:BONSAI_TOOLS_TARGET 'aarch64-pc-windows-msvc/release/bonsai-tools.exe'
        if (-not [IO.File]::Exists($builtTool)) { throw 'Packaged maintenance CLI build output is missing.' }
        [void][IO.Directory]::CreateDirectory($env:BONSAI_TOOLS_PACKAGE)
        $tool = Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-tools.exe'
        Copy-Item -LiteralPath $builtTool -Destination $tool
        Copy-Item -LiteralPath (Join-Path $env:BONSAI_TOOLS_TARGET 'aarch64-pc-windows-msvc/release/bonsai-reference-numerics.exe') -Destination (Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-reference-numerics.exe')
        $numeric = Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-reference-numerics.exe'
        $probe = Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-completion-test-probe.exe'
        Copy-Item -LiteralPath (Join-Path $env:BONSAI_TOOLS_TARGET 'aarch64-pc-windows-msvc/release/bonsai-completion-test-probe.exe') -Destination $probe
        @{
          SchemaVersion = 4
          HostId = $env:BONSAI_TOOLS_CACHE_HOST
          SourceId = $env:BONSAI_TOOLS_SOURCE_ID
          Toolchain = 'nightly-2026-11-12-aarch64-pc-windows-msvc'
          Sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          NumericSha256 = (Get-FileHash -LiteralPath $numeric -Algorithm SHA256).Hash.ToLowerInvariant()
          ProbeSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
        } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:BONSAI_TOOLS_PACKAGE 'receipt.json')
    - name: Verify the packaged CLI and select it for script invocations
      shell: pwsh
      working-directory: ${{ runner.temp }}
      env:
        EXECUTABLE_CACHE_HIT: ${{ steps.executable-cache.outputs.cache-hit }}
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $tool = Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-tools.exe'
        $numeric = Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-reference-numerics.exe'
        $probe = Join-Path $env:BONSAI_TOOLS_PACKAGE 'bonsai-completion-test-probe.exe'
        $receipt = Get-Content -LiteralPath (Join-Path $env:BONSAI_TOOLS_PACKAGE 'receipt.json') -Raw | ConvertFrom-Json
        if ($receipt.SchemaVersion -ne 4 -or $receipt.HostId -cne $env:BONSAI_TOOLS_CACHE_HOST -or
            $receipt.SourceId -cne $env:BONSAI_TOOLS_SOURCE_ID -or
            $receipt.Toolchain -cne 'nightly-2026-11-12-aarch64-pc-windows-msvc' -or
            $receipt.Sha256 -cne (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -or
            $receipt.NumericSha256 -cne (Get-FileHash -LiteralPath $numeric -Algorithm SHA256).Hash.ToLowerInvariant() -or
            $receipt.ProbeSha256 -cne (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Packaged CLI digest or build identity differs.' }
        & $tool artifact --json (@{ operation = 'arm64'; path = $tool } | ConvertTo-Json -Compress) | Out-Null
        & $tool artifact --json (@{ operation = 'arm64'; path = $probe } | ConvertTo-Json -Compress) | Out-Null
        & $tool artifact --json (@{ operation = 'arm64'; path = $numeric } | ConvertTo-Json -Compress) | Out-Null
        "BONSAI_TOOLS_PATH=$tool" >> $env:GITHUB_ENV
        "BONSAI_COMPLETION_PROBE_PATH=$probe" >> $env:GITHUB_ENV
        "BONSAI_REFERENCE_NUMERIC_TOOL=$numeric" >> $env:GITHUB_ENV
        "Exact packaged CLI cache hit: $env:EXECUTABLE_CACHE_HIT; correctness checks still run in every lane." >> $env:GITHUB_STEP_SUMMARY
    - name: Retain packaged CLI build evidence
      if: always() && steps.executable-cache.outputs.cache-hit != 'true' && env.BONSAI_TOOLS_BUILD_EVIDENCE != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tools-build-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.BONSAI_TOOLS_BUILD_ID }}
        path: ${{ env.BONSAI_TOOLS_BUILD_EVIDENCE }}
        if-no-files-found: error
