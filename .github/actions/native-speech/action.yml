name: Prepare native ASR compiler
description: Prepare the pinned ASR compiler; TTS builds entirely as Rust.
inputs:
  lane:
    required: true
    description: Application lane (only ASR requires native prerequisites).
runs:
  using: composite
  steps:
    - name: Select the native ASR child compiler environment
      if: inputs.lane == 'asr'
      shell: pwsh
      working-directory: ${{ runner.temp }}
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        & $env:BONSAI_TOOLS_PATH build-tools --json (@{ operation = 'speech-environment'; dataDirectory = (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-NativeSpeech'); workingDirectory = $env:RUNNER_TEMP } | ConvertTo-Json -Compress)
