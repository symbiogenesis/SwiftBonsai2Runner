name: Check selected native Rust regressions
description: Run explicit model-free selections and require typed positive libtest results for every selection.
inputs:
  package:
    description: One workspace package.
    required: true
  target-kind:
    description: Cargo target kind (lib, bin or test).
    default: lib
  target-name:
    description: Named bin or test target; empty for lib.
    default: ''
  selections:
    description: JSON array of name, exact and expected-passed fields; null count permits a nonempty group.
    required: true
  target-directory:
    description: Absolute external Cargo target directory, never an evidence or package directory.
    required: true
  toolchain:
    description: Explicit native Windows ARM64 Rust compiler.
    default: nightly-2026-11-12-aarch64-pc-windows-msvc
runs:
  using: composite
  steps:
    - name: Run and validate every selected model-free control
      shell: pwsh
      working-directory: ${{ runner.temp }}
      env:
        REGRESSION_PACKAGE: ${{ inputs.package }}
        REGRESSION_TARGET_KIND: ${{ inputs.target-kind }}
        REGRESSION_TARGET_NAME: ${{ inputs.target-name }}
        REGRESSION_SELECTIONS: ${{ inputs.selections }}
        REGRESSION_TARGET_DIRECTORY: ${{ inputs.target-directory }}
        REGRESSION_TOOLCHAIN: ${{ inputs.toolchain }}
        CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
        CARGO_BUILD_FINGERPRINT: content
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        @{
          root = $env:GITHUB_WORKSPACE
          targetDirectory = $env:REGRESSION_TARGET_DIRECTORY
          package = $env:REGRESSION_PACKAGE
          toolchain = $env:REGRESSION_TOOLCHAIN
          targetKind = $env:REGRESSION_TARGET_KIND
          targetName = $env:REGRESSION_TARGET_NAME
          selections = ConvertFrom-Json -InputObject $env:REGRESSION_SELECTIONS -NoEnumerate
        } | ConvertTo-Json -Depth 8 -Compress | & $env:BONSAI_CI_PATH native-regressions --request -
