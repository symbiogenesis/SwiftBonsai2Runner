name: Source checks
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.rumdl.toml'
      - Cargo.lock
      - Cargo.toml
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - '.github/**'
      - 'tools/ci/**'
      - .github/workflows/source-checks.yml
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actions-lock:
    # Independent of changed-path selection so every triggered run verifies CI.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    concurrency:
      group: actions-lock-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the sole additional CI security tool
        run: |
          set -euo pipefail
          # gh-actions-lock v0.4.1 (source 04b7a1a4d00b339dd3ff903bb4d78d4066b2bac7).
          # Review the release and update this URL and digest together.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/github/gh-actions-lock/releases/download/v0.4.1/linux-arm64 \
            --output "$RUNNER_TEMP/gh-actions-lock"
          echo 'aee61c993da36a5f09be2c77e6e4a1a22542a1b30ded4996bf8301c15dcf2b39  '"$RUNNER_TEMP/gh-actions-lock" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/gh-actions-lock"
      - name: Verify every workflow lock and upstream repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/gh-actions-lock" --verify'
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      portable: ${{ steps.select.outputs.portable }}
      markdown: ${{ steps.select.outputs.markdown }}
      audit: ${{ steps.select.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select source checks without compiling a planner
        id: select
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import os
          import re
          import subprocess

          event = os.environ['EVENT_NAME']
          main = os.environ['EVENT_REF'] == 'refs/heads/main'
          eligible = {
              'portable': event in ('pull_request', 'workflow_dispatch'),
              'markdown': event in ('push', 'pull_request', 'workflow_dispatch'),
              'audit': main and event in ('push', 'schedule', 'workflow_dispatch'),
          }
          selected = eligible.copy()
          reason = 'Manual checks or weekly fresh-advisory audit.'
          if event in ('push', 'pull_request'):
              try:
                  base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
                  if not all(re.fullmatch(r'[0-9a-fA-F]{40}', sha) and int(sha, 16) for sha in (base, head)):
                      raise ValueError('Missing, zero or malformed source range.')
                  # PRs compare their own head with its merge base, excluding
                  # unrelated base-branch changes; pushes cover the whole push.
                  separator = '...' if event == 'pull_request' else '..'
                  raw = subprocess.check_output(
                      ['git', 'diff', '--name-only', '--no-renames', '-z', base + separator + head, '--'],
                      stderr=subprocess.DEVNULL, timeout=20,
                  )
                  paths = raw.decode('utf-8').split('\0')
                  paths = [path for path in paths if path]
              except (OSError, ValueError, subprocess.SubprocessError):
                  reason = 'Unavailable source range: conservatively select every eligible check.'
              else:
                  workflow = '.github/workflows/source-checks.yml'
                  docs_only = lambda path: path.endswith('.md') or path.startswith('docs/') or path == '.rumdl.toml'
                  dependency = lambda path: (
                      path in ('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', workflow)
                      or path.endswith('/Cargo.toml')
                      or path.startswith('.github/actions/rust-toolchain/')
                  )
                  selected = {
                      'portable': eligible['portable'] and any(not docs_only(path) for path in paths),
                      'markdown': eligible['markdown'] and any(path.endswith('.md') or path in ('.rumdl.toml', workflow) for path in paths),
                      'audit': eligible['audit'] and any(dependency(path) for path in paths),
                  }
                  reason = 'Selected from the complete changed-path range.'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, enabled in selected.items():
                  print(f'{name}={str(enabled).lower()}', file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              print(reason, file=summary)
              for name, enabled in selected.items():
                  print(f'- {name}: {str(enabled).lower()}', file=summary)
  portable:
    needs: changes
    if: >-
      always() && !cancelled()
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (needs.changes.result != 'success' || needs.changes.outputs.portable == 'true')
    concurrency:
      group: portable-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    # Untrusted pull requests run only on a disposable hosted runner. This
    # focused screen cannot qualify native Windows or actual-model behavior.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject an unsuccessful source-check selector
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo 'Source-check selection failed; portable checks cannot be skipped.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-unknown-linux-gnu
          components: rustfmt
      - name: Check workspace Rust formatting
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/SwiftBonsai-Premerge
        run: cargo +nightly-2026-11-09 fmt --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --all -- --check
      - name: Compile portable policy, broker and CI targets
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/SwiftBonsai-Premerge
        run: >-
          cargo +nightly-2026-11-09 check --locked --release
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --package bonsai-ci --package bonsai-cpu-policy --package bonsai-broker
          --all-targets
      - name: Run selected model-free routing and policy regressions
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/SwiftBonsai-Premerge
        run: |
          set -euo pipefail
          exact_test() {
            local case_name="$1"
            shift
            # An accidentally renamed/removed case must not silently pass with
            # zero tests. Listing compiles the target without executing it.
            local listed
            listed="$(cargo +nightly-2026-11-09 test --locked --release --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" "$@" "$case_name" -- --exact --list)"
            if ! printf '%s\n' "$listed" | grep -Fx -- "$case_name: test"; then
              echo "Required focused regression is missing: $case_name" >&2
              return 1
            fi
            cargo +nightly-2026-11-09 test --locked --release --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" "$@" "$case_name" -- --exact
          }
          exact_test leaf_change_selects_transitive_consumers_without_sibling --package bonsai-ci --test routing
          exact_test failed_planner_and_malformed_results_cannot_pass --package bonsai-ci --test routing
          exact_test tests::swift_development_budget_keeps_four_gib_reserve_for_every_artifact --package bonsai-cpu-policy --lib
          exact_test rejects_alternate_hosts_and_browser_origins --package bonsai-broker --test request_policy
          exact_test typed_schema_rejects_aliases_controls_tools_and_media --package bonsai-broker --test request_policy
          exact_test context_admission_fails_closed_at_boundary_and_overflow --package bonsai-broker --test request_policy
  markdown:
    needs: changes
    if: >-
      always() && !cancelled()
      && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (needs.changes.result != 'success' || needs.changes.outputs.markdown == 'true')
    concurrency:
      group: markdown-standards-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject an unsuccessful source-check selector
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo 'Source-check selection failed; Markdown checks cannot be skipped.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned rumdl linter
        id: rumdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rumdl-bin
          key: rumdl-v1-${{ runner.os }}-${{ runner.arch }}-0.3.2-afc6dd91f1c4
      - name: Install and verify the pinned rumdl linter on a cache miss
        if: steps.rumdl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          asset="rumdl-v0.3.2-aarch64-unknown-linux-musl.tar.gz"
          expected="afc6dd91f1c4f2a8cf4a40ab99f8e52e06e6dddfc5334f1c1db8b158d353d143"
          curl -fsSL --retry 3 -o "$asset" "https://github.com/rvben/rumdl/releases/download/v0.3.2/$asset"
          printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/rumdl-bin"
          tar -xzf "$asset" -C "$RUNNER_TEMP/rumdl-bin" rumdl
          chmod 0755 "$RUNNER_TEMP/rumdl-bin/rumdl"
          rm -f "$asset"
      - name: Check Markdown lint and formatting contracts
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rumdl-bin/rumdl" --version
          "$RUNNER_TEMP/rumdl-bin/rumdl" check --no-cache .
          "$RUNNER_TEMP/rumdl-bin/rumdl" fmt --check --no-cache .
  audit:
    needs: changes
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (needs.changes.result != 'success' || needs.changes.outputs.audit == 'true')
    concurrency:
      group: dependency-audit-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Reject an unsuccessful source-check selector
        if: needs.changes.result != 'success'
        shell: bash
        run: |
          echo 'Source-check selection failed; dependency auditing cannot be skipped.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        id: compiler
        with:
          toolchain: nightly-2026-11-09-aarch64-unknown-linux-gnu
          components: ''
      - name: Cache the pinned audit tool
        id: audit-tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-nightly-2026-11-09-0.22.2
      - name: Install the pinned audit tool
        if: steps.audit-tool.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo +nightly-2026-11-09 install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
      - name: Check the complete lockfile against fresh advisories
        working-directory: ${{ runner.temp }}
        # Do not cache the advisory database or suppress off-target notices.
        # Known vulnerabilities and yanked packages fail; maintenance notices
        # remain visible for every platform represented by the lockfile.
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file "$GITHUB_WORKSPACE/Cargo.lock" --deny yanked'
