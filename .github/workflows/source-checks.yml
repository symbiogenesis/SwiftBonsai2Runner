name: Source checks
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.rumdl.toml'
      - Cargo.lock
      - '**/Cargo.lock'
      - Cargo.toml
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - '.github/**'
      - 'tools/ci/**'
      - .github/workflows/source-checks.yml
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actions-lock:
    # One checkout selects checks and verifies CI before expensive jobs start.
    outputs:
      portable: ${{ steps.select.outputs.portable }}
      markdown: ${{ steps.select.outputs.markdown }}
      audit: ${{ steps.select.outputs.audit }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    concurrency:
      # Push ranges are incremental: a later unrelated push must not cancel a
      # selected check before this preflight can hand it off. PR ranges include
      # the complete branch, so only PR preflights can supersede each other.
      group: actions-lock-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select source checks without compiling a planner
        id: select
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & ./tools/ci/select_source_checks.ps1
      - name: Check source-check routing regression fixtures
        run: pwsh -NoProfile -File tools/ci/test_source_checks.ps1
      - name: Reject owned Python code and runtime setup
        run: pwsh -NoProfile -File tools/ci/check_owned_languages.ps1
      - name: Check source-language policy regression fixtures
        run: pwsh -NoProfile -File tools/ci/test_owned_languages.ps1
      - name: Check exact startup lock coverage and full action pins offline
        run: pwsh -NoProfile -File tools/ci/check_workflow_startup.ps1
      - name: Check GitHub Actions syntax and expressions
        run: pwsh -NoLogo -NoProfile -File tools/ci/check_workflow_syntax.ps1 -CheckFixtures
      - name: Check startup lock regression fixtures
        run: pwsh -NoProfile -File tools/ci/test_workflow_startup.ps1
      - name: Check staged workflow guard regression fixtures
        run: pwsh -NoProfile -File tools/ci/test_staged_workflows.ps1
      - name: Download and verify the sole additional CI security tool
        run: |
          set -euo pipefail
          # gh-actions-lock v0.4.1 (source 04b7a1a4d00b339dd3ff903bb4d78d4066b2bac7).
          # Review the release and update this URL and digest together.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-max-time 90 --connect-timeout 15 --proto '=https' --tlsv1.2 --max-time 60 \
            https://github.com/github/gh-actions-lock/releases/download/v0.4.1/linux-arm64 \
            --output "$RUNNER_TEMP/gh-actions-lock"
          echo 'aee61c993da36a5f09be2c77e6e4a1a22542a1b30ded4996bf8301c15dcf2b39  '"$RUNNER_TEMP/gh-actions-lock" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/gh-actions-lock"
      - name: Verify every workflow lock and upstream repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/gh-actions-lock" --verify'
  portable:
    needs: actions-lock
    if: >-
      always() && !cancelled()
      && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (needs.actions-lock.result != 'success' || needs.actions-lock.outputs.portable == 'true')
    concurrency:
      # Independent push preflights can finish out of order. Only cumulative PR
      # checks may supersede one another; push, schedule and manual runs stay unique.
      group: portable-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Checkout timestamps change; Cargo must verify restored source contents.
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
    # Untrusted pull requests run only on a disposable hosted runner. This
    # focused screen cannot qualify native Windows or actual-model behavior.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject an unsuccessful source-check preflight
        if: needs.actions-lock.result != 'success'
        shell: bash
        run: |
          echo 'Source-check preflight failed; portable checks cannot be skipped.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        id: compiler
        with:
          toolchain: nightly-2026-11-12-aarch64-unknown-linux-gnu
          components: rustfmt
      - name: Reuse portable Cargo downloads and compiler outputs
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/SwiftBonsai-Premerge
          key: portable-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-${{ steps.compiler.outputs.compiler-identity }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**') }}-${{ github.sha }}-content-v1
          restore-keys: |
            portable-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-${{ steps.compiler.outputs.compiler-identity }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**') }}-
            portable-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-${{ steps.compiler.outputs.compiler-identity }}-
      - name: Check workspace Rust formatting
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/SwiftBonsai-Premerge
        run: cargo +nightly-2026-11-12 fmt --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --all -- --check
      - name: Compile portable policy, broker and CI targets
        id: compile
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/SwiftBonsai-Premerge
        run: >-
          cargo +nightly-2026-11-12 check --locked --release
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --package bonsai-ci --package bonsai-cpu-policy --package bonsai-broker
          --all-targets
      - name: Run selected model-free routing and policy regressions
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/SwiftBonsai-Premerge
        run: |
          set -euo pipefail
          exact_test() {
            local case_name="$1"
            shift
            # An accidentally renamed/removed case must not silently pass with
            # zero tests. Listing compiles the target without executing it.
            local listed
            listed="$(cargo +nightly-2026-11-12 test --locked --release --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" "$@" "$case_name" -- --exact --list)"
            if ! printf '%s\n' "$listed" | grep -Fx -- "$case_name: test"; then
              echo "Required focused regression is missing: $case_name" >&2
              return 1
            fi
            cargo +nightly-2026-11-12 test --locked --release --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" "$@" "$case_name" -- --exact
          }
          exact_test leaf_change_selects_transitive_consumers_without_sibling --package bonsai-ci --test routing
          exact_test failed_planner_and_malformed_results_cannot_pass --package bonsai-ci --test routing
          exact_test tests::swift_development_budget_keeps_four_gib_reserve_for_every_artifact --package bonsai-cpu-policy --lib
          exact_test rejects_alternate_hosts_and_browser_origins --package bonsai-broker --test request_policy
          exact_test typed_schema_rejects_aliases_controls_tools_and_media --package bonsai-broker --test request_policy
          exact_test context_admission_fails_closed_at_boundary_and_overflow --package bonsai-broker --test request_policy
      - name: Preserve portable compiler outputs after checks
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/SwiftBonsai-Premerge
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  markdown:
    needs: actions-lock
    if: >-
      always() && !cancelled()
      && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      && (needs.actions-lock.result != 'success' || needs.actions-lock.outputs.markdown == 'true')
    concurrency:
      group: markdown-standards-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject an unsuccessful source-check preflight
        if: needs.actions-lock.result != 'success'
        shell: bash
        run: |
          echo 'Source-check preflight failed; Markdown checks cannot be skipped.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned rumdl linter
        id: rumdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rumdl-bin
          key: rumdl-v1-${{ runner.os }}-${{ runner.arch }}-0.3.2-afc6dd91f1c4
      - name: Install and verify the pinned rumdl linter on a cache miss
        if: steps.rumdl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          asset="rumdl-v0.3.2-aarch64-unknown-linux-musl.tar.gz"
          expected="afc6dd91f1c4f2a8cf4a40ab99f8e52e06e6dddfc5334f1c1db8b158d353d143"
          curl -fsSL --retry 3 --retry-delay 2 --retry-max-time 90 --connect-timeout 15 --max-time 60 -o "$asset" "https://github.com/rvben/rumdl/releases/download/v0.3.2/$asset"
          printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/rumdl-bin"
          tar -xzf "$asset" -C "$RUNNER_TEMP/rumdl-bin" rumdl
          chmod 0755 "$RUNNER_TEMP/rumdl-bin/rumdl"
          rm -f "$asset"
      - name: Check Markdown lint and formatting contracts
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rumdl-bin/rumdl" --version
          "$RUNNER_TEMP/rumdl-bin/rumdl" check --no-cache .
          "$RUNNER_TEMP/rumdl-bin/rumdl" fmt --check --no-cache .
  audit:
    needs: actions-lock
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (needs.actions-lock.result != 'success' || needs.actions-lock.outputs.audit == 'true')
    concurrency:
      group: dependency-audit-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Reject an unsuccessful source-check preflight
        if: needs.actions-lock.result != 'success'
        shell: bash
        run: |
          echo 'Source-check preflight failed; dependency auditing cannot be skipped.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust-toolchain
        id: compiler
        with:
          toolchain: nightly-2026-11-12-aarch64-unknown-linux-gnu
          components: ''
      - name: Cache the pinned audit tool
        id: audit-tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.image-identity }}-nightly-2026-11-12-0.22.2
      - name: Install the pinned audit tool
        if: steps.audit-tool.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo +nightly-2026-11-12 install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/cargo-audit"
      - name: Check the complete workspace lockfile against fresh advisories
        id: workspace-audit
        working-directory: ${{ runner.temp }}
        # Do not cache the advisory database or suppress off-target notices.
        # Known vulnerabilities and yanked packages fail; maintenance notices
        # remain visible for every platform represented by the lockfile.
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file "$GITHUB_WORKSPACE/Cargo.lock" --deny yanked'
      - name: Check the independent SDK reader lockfile against fresh advisories
        # A failed workspace audit must not conceal the independent lockfile's result.
        if: ${{ !cancelled() && (steps.workspace-audit.outcome == 'success' || steps.workspace-audit.outcome == 'failure') }}
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file "$GITHUB_WORKSPACE/tools/hexagon/sdk-reader/Cargo.lock" --deny yanked'
