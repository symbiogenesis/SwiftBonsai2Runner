name: Hexagon native Windows ARM64 queue and wire ABI
on:
  workflow_call:
  push:
    branches: [main, 'codex/hexagon-**']
    paths:
      - .github/workflows/hexagon-windows-abi.yml
      - tools/hexagon/windows_queue_abi.*
      - tools/hexagon/windows-queue-abi.lock.json
      - tools/hexagon/public_idl_control.rs
      - tools/hexagon/public_qaic_wire.c
      - tools/hexagon/public-qaic-wire.expected.json
      - tools/hexagon/public-qaic.lock.json
      - tools/hexagon/native_rpc/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-native-abi:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        id: rust
        with:
          toolchain: nightly-2026-11-09-aarch64-pc-windows-msvc
          components: ''
      - name: Compare real public queue declarations, native packets and explicitly selected wire branch
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B (Join-Path $env:GITHUB_WORKSPACE 'tools/hexagon/windows_queue_abi.py') --output (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Hexagon-Windows-ABI') --rustc (Join-Path '${{ steps.rust.outputs.toolchain-path }}' 'bin/rustc.exe')
      - name: Retain independent compiler, source, ABI, wire and losing-control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hexagon-windows-abi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-Hexagon-Windows-ABI/review
          if-no-files-found: warn
          retention-days: 90
