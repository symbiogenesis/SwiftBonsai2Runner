name: Swift LoRA qualification plan (capture pending)
on:
  workflow_dispatch:
    inputs:
      representation:
        description: Fixed representation for both arms
        type: choice
        options: [PQ2_0, current-repacked-PTQ1_0]
        default: PQ2_0
      qualification:
        description: Separate fixed adapter scale contract
        type: choice
        options: [standard-scale-one, app-scale-1.3]
        default: standard-scale-one
permissions:
  contents: read
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    # Full matrices cannot fit the owner's aggregate five-minute allowance.
    # Preserve the fixed contract and leave captures pending a hosted target device.
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - name: Retain the nonlaunching native qualification plan
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          BONSAI_REPRESENTATION: ${{ inputs.representation }}
          BONSAI_QUALIFICATION: ${{ inputs.qualification }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $request = Join-Path $env:RUNNER_TEMP 'lora-plan-request.json'
          @{ operation='plan'; qualificationProfile=$env:BONSAI_QUALIFICATION; weightRepresentation=$env:BONSAI_REPRESENTATION } |
            ConvertTo-Json | Set-Content -LiteralPath $request -Encoding utf8NoBOM
          & $env:BONSAI_TOOLS_PATH qualification --request $request |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'lora-plan.json') -Encoding utf8NoBOM
          'Qualification remains pending. This workflow records the fixed plan without model execution. The 28-sample matrix requires a hosted Snapdragon target; it must not be split across owner runs to evade the five-minute total allowance.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-lora-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lora-plan.json
          if-no-files-found: error
          retention-days: 90
