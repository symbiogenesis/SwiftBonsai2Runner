name: Swift PTQ1 screen plan (capture pending)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    # Fourteen samples have no demonstrated complete five-minute owner bound.
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - name: Retain the nonlaunching native screen plan
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $request = Join-Path $env:RUNNER_TEMP 'screen-plan-request.json'
          @{ operation='screen-plan' } | ConvertTo-Json |
            Set-Content -LiteralPath $request -Encoding utf8NoBOM
          & $env:BONSAI_TOOLS_PATH qualification --request $request |
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'screen-plan.json') -Encoding utf8NoBOM
          'Screen qualification remains pending. This workflow records the fixed plan without model execution. The 14-sample screen requires a hosted Snapdragon target; owner runs cannot restart or split its aggregate five-minute allowance.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-ptq1-screen-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screen-plan.json
          if-no-files-found: error
          retention-days: 90
