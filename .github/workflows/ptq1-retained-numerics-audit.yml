name: Hosted PTQ1 retained numerical evidence audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ptq1-retained-numerics-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bounded archive and original-producer rejection controls
        run: >-
          python3 -B tools/native-reference/test_audit_retained.py
          RetainedAuditTests.test_inexact_producer_artifact_and_job_reject
          RetainedAuditTests.test_regular_files_match_exact_manifest
          RetainedAuditTests.test_traversal_symlink_and_duplicate_members_reject
          RetainedAuditTests.test_missing_unexpected_extent_and_hash_mismatch_reject
          RetainedAuditTests.test_original_comparator_identity_rejects_before_import
          RetainedAuditTests.test_redirect_strips_credentials_and_rejects_unapproved_hosts
      - name: Obtain the original immutable comparator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 469f57b233898fd10b97d5ebc10aaef78b940e30
          path: original-source
          sparse-checkout: tools/native-reference/compare.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify retained files and replay the original comparator without inference
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python3 -B tools/native-reference/audit_retained.py
          --comparator original-source/tools/native-reference/compare.py
          --output "$RUNNER_TEMP/ptq1-retained-numerics-audit"
      - name: Retain the cloud integrity audit and every retained file identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ptq1-retained-numerics-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ptq1-retained-numerics-audit
          if-no-files-found: error
          retention-days: 90
