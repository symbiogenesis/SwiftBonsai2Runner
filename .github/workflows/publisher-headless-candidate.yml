name: Publisher headless CPU source candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - name: Check native hosted preparation, extraction and CMake path policy
        shell: pwsh
        run: |
          cargo +nightly-2026-11-02 test --locked --release --target-dir $env:BONSAI_TOOLS_TARGET -p bonsai-tools --lib build_tools::
      - name: Check static dependency rejection without executable targets
        shell: pwsh
        run: python -B tools/runtime-candidates/test_pe_closure.py
      - name: Build and check separate candidate without model artifacts
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = Join-Path $env:RUNNER_TEMP ('Publisher-Headless-Candidate-' + [guid]::NewGuid().ToString('N'))
          "BONSAI_HEADLESS_CANDIDATE=$output" >> $env:GITHUB_ENV
          foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
            Remove-Item -LiteralPath ('Env:' + $name) -ErrorAction SilentlyContinue
          }
          & $env:BONSAI_TOOLS_PATH build-tools --json (@{ operation = 'headless-publisher'; repositoryRoot = $env:GITHUB_WORKSPACE; outputDirectory = $output } | ConvertTo-Json -Compress)
      - name: Retain public-source candidate and bounded model-free evidence
        if: always() && env.BONSAI_HEADLESS_CANDIDATE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publisher-headless-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_HEADLESS_CANDIDATE }}
          if-no-files-found: error
          retention-days: 90
