name: Native Rust actual-model application acceptance
run-name: Native Rust acceptance (${{ inputs.run_device && 'owner device' || 'hosted preparation' }}, ${{ inputs.profile }})
on:
  workflow_dispatch:
    inputs:
      run_device:
        description: Run one bounded owner-device workload after hosted preparation; false prepares and retains tools only
        type: boolean
        default: false
      profile:
        description: Explicit bounded profile; setup/model work/cleanup shares one declared job budget
        type: choice
        options: [pq2-no-adapter, ptq1-adapter, ptq1-adapter-lifecycle, ptq1-adapter-lifecycle-row4, ptq1-adapter-boundaries-row4, ptq1-adapter-service-row4, ptq1-adapter-service-rollback-row4, pq2-adapter-row4, pq2-adapter-lifecycle-row4, pq2-adapter-service-row4, pq2-adapter-speed, ptq1-pq2-complete-response, ptq1-pq2-complete-response-row4]
        default: pq2-no-adapter
        required: false
      owner_budget_minutes:
        description: Five preferred; choose the smallest estimated whole-job bound, including setup and cleanup
        type: choice
        options: ['5', '10', '15']
        default: '5'
        required: false
      budget_reason:
        description: For 10/15 minutes, record the fixed workload time estimate and why it cannot fit five
        type: string
        default: ''
        required: false
      bounded_history:
        description: PQ2 no-adapter only; 128 history repetitions, four-token stream and same-owner reuse within the same budget
        type: boolean
        default: false
        required: false
      stalled_consumer:
        description: PQ2 no-adapter only; Stop after first visible content and one second without reads, then fresh-owner recovery
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  # Hosted-only preparation uses no physical device and must not occupy its lane.
  # Explicit device captures share the physical laptop and memory budget.
  group: ${{ inputs.run_device && 'swift-lora-snapdragon' || format('native-acceptance-hosted-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      # Restored Cargo outputs follow source contents across checkout timestamps.
      # Every analyzer, linker and regression still runs for this exact source.
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/bonsai-tools
      - uses: $/.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-pc-windows-msvc
      - uses: $/.github/actions/ci-tool
      - name: Select the native acceptance build cache identity
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'Native acceptance build caching requires the hosted runner image identity.' }
          "NATIVE_ACCEPTANCE_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
      - name: Reuse compatible native acceptance compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Acceptance packages, receipts, analyzer evidence and model captures
          # stay outside this target. A hit supplies no acceptance verdict.
          path: ${{ runner.temp }}/Native-Acceptance-Build
          key: native-acceptance-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_ACCEPTANCE_CACHE_HOST }}-nightly-2026-11-09-aarch64-pc-windows-msvc-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}-${{ hashFiles('src/**', 'tools/bonsai/**', 'tools/ci/**', 'config/**', 'tests/fixtures/**', '.github/workflows/native-runtime-acceptance.yml', '.github/actions/**') }}-content-v1
          restore-keys: |
            native-acceptance-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_ACCEPTANCE_CACHE_HOST }}-nightly-2026-11-09-aarch64-pc-windows-msvc-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}-
      - name: Check shared regression command rejection and output controls
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B (Join-Path $env:GITHUB_WORKSPACE 'tools/ci/test_native_regressions.py')
          if ($LASTEXITCODE -ne 0) { throw 'Shared native regression command controls failed.' }
      - name: Check actual PowerShell syntax and typed receipt rejection controls
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $blocks = 0
          foreach ($contractSource in @('.github/workflows/native-runtime-acceptance.yml', '.github/actions/native-regressions/action.yml')) {
            $lines = [IO.File]::ReadAllLines((Join-Path $env:GITHUB_WORKSPACE $contractSource))
            for ($index = 0; $index -lt $lines.Length; $index++) {
              if ($lines[$index] -notmatch '^(?<indent> +)run:\s*\|\s*$') { continue }
              $indent = $Matches.indent.Length + 2
              $body = [Collections.Generic.List[string]]::new()
              for ($next = $index + 1; $next -lt $lines.Length; $next++) {
                $line = $lines[$next]
                if ($line.Trim().Length -gt 0 -and ($line.Length -lt $indent -or $line.Substring(0, $indent).Trim().Length -gt 0)) { break }
                $body.Add($(if ($line.Length -ge $indent) { $line.Substring($indent) } else { '' }))
              }
              $tokens = $null; $parseErrors = $null
              [Management.Automation.Language.Parser]::ParseInput(($body -join "`n"), [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -ne 0) { throw 'A native acceptance workflow or shared regression PowerShell block does not parse.' }
              $blocks++
            }
          }
          $tokens = $null; $parseErrors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/Start-Chat.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'The native launcher PowerShell source does not parse.' }
          $fixtures = & $env:BONSAI_CI_PATH native-acceptance-guard --json (@{ operation='self-check'; revision=$env:GITHUB_SHA } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Typed analyzer/test-output negative controls failed.' }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CiBootstrap'
          $controls = @('command::native_acceptance_guard::tests::negative_fixtures_cover_receipts_and_test_output',
            'command::native_acceptance_guard::tests::workflow_receipt_requires_source_bound_complete_controls')
          foreach ($case in $controls) {
            $output = @(& cargo +nightly-2026-11-09 test --locked --release --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-ci --lib $case -- --exact)
            $code = $LASTEXITCODE
            $output | Write-Output
            & $env:BONSAI_CI_PATH native-acceptance-guard --json (@{ operation='test-output'; output=$output; exitCode=$code; expectedPassed=1 } | ConvertTo-Json -Depth 4 -Compress)
            if ($LASTEXITCODE -ne 0) { throw 'The exact typed admission regression was not executed successfully.' }
          }
          $sources = @('.github/actions/native-regressions/action.yml', '.github/workflows/native-runtime-acceptance.yml', 'scripts/Start-Chat.ps1', 'tools/ci/Cargo.toml', 'tools/ci/src/command.rs', 'tools/ci/src/native_acceptance_guard.rs') | ForEach-Object {
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes([IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $_)).Replace("`r`n", "`n"))
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            [ordered]@{ Path=$_; Bytes=$bytes.Length; Sha256=$hash }
          }
          $contract = [ordered]@{
            SchemaVersion=1; Kind='native-acceptance-workflow-contract'; Revision=$env:GITHUB_SHA; Success=$true
            ReceiptFixtures=$fixtures.ReceiptFixtures; OutputFixtures=$fixtures.OutputFixtures
            ParsedPowerShellBlocks=$blocks; ParsedLauncher=$true; ExactRustControls=$controls
            SourceDigestScope='utf8-no-bom-lf'; Sources=@($sources)
          }
          & $env:BONSAI_CI_PATH native-acceptance-guard --json (@{ operation='workflow-receipt'; receipt=$contract; revision=$env:GITHUB_SHA; sources=@($sources) } | ConvertTo-Json -Depth 8 -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Workflow syntax/control receipt is incomplete.' }
          $contractPath = Join-Path $env:RUNNER_TEMP 'native-acceptance-workflow-contract.json'
          $contract | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $contractPath -Encoding utf8NoBOM
          "BONSAI_NATIVE_CONTRACT_RECEIPT=$contractPath" >> $env:GITHUB_ENV
      - name: Require strict Release analyzers and native executable linking for the exact source
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('Native-Acceptance-Analyzers-' + [guid]::NewGuid().ToString('N'))
          "BONSAI_NATIVE_ANALYZER_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          # This hosted prerequisite closes no model/device gate. In particular,
          # it cannot extend the closed local UI-analyzer validation session.
          & $env:BONSAI_CI_PATH rust-check --root $env:GITHUB_WORKSPACE --package bonsai-chat --package bonsai-broker --package bonsai-tools --phase clippy --phase build --toolchain nightly-2026-11-09-aarch64-pc-windows-msvc --target (Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Build') --evidence $evidence --timeout-seconds 1200
          if ($LASTEXITCODE -ne 0) { throw 'Hosted strict Release analyzers or native executable linking failed; no owner-device acceptance package is admitted.' }
      - name: Require model-free renderer and default selection controls
        uses: $/.github/actions/native-regressions
        with:
          package: bonsai-tools
          target-directory: ${{ runner.temp }}/Native-Acceptance-Build
          selections: >-
            [{"name":"chat_launch::tests::graphics_backend_selection_is_explicit_and_scoped_to_the_chat_child","exact":true,"expected-passed":1},
            {"name":"chat_launch::tests::graphics_backend_selection_rejects_unsupported_values_before_startup","exact":true,"expected-passed":1},
            {"name":"cli::tests::graphics_backend_option_preserves_explicit_selection_and_rejects_duplicates","exact":true,"expected-passed":1},
            {"name":"chat_launch::tests::development_default_and_explicit_rollback_survive_deferred_preparation","exact":true,"expected-passed":1}]
      - name: Require private broker owner shutdown controls
        uses: $/.github/actions/native-regressions
        with:
          package: bonsai-broker
          target-directory: ${{ runner.temp }}/Native-Acceptance-Build
          selections: '[{"name":"owner_shutdown_","exact":false,"expected-passed":null}]'
      - name: Require native UI owner shutdown controls
        uses: $/.github/actions/native-regressions
        with:
          package: bonsai-chat
          target-kind: bin
          target-name: bonsai-chat
          target-directory: ${{ runner.temp }}/Native-Acceptance-Build
          selections: '[{"name":"owned_broker_","exact":false,"expected-passed":null}]'
      - name: Build exact acceptance binary without executing model tests
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Package'
          if (Test-Path -LiteralPath $package) { throw 'Hosted acceptance packaging requires a fresh directory.' }
          [void][IO.Directory]::CreateDirectory($package)
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Build'
          $messages = Join-Path $env:RUNNER_TEMP 'native-acceptance-build.jsonl'
          "BONSAI_NATIVE_BUILD_EVIDENCE=$messages" >> $env:GITHUB_ENV
          $cargo = (Get-Command cargo -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          & $cargo +nightly-2026-11-09 test --locked --release --no-run --message-format=json --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-broker --test native_model | Set-Content -LiteralPath $messages -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Hosted acceptance binary build failed.' }
          $artifacts = @(Get-Content -LiteralPath $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -ceq 'compiler-artifact' -and $_.target.name -ceq 'native_model' -and $_.executable })
          if ($artifacts.Count -ne 1) { throw 'Exactly one native_model test binary is required.' }
          Copy-Item -LiteralPath $artifacts[0].executable -Destination (Join-Path $package 'native-model-acceptance.exe')
          $modelFreeCases = @(& (Join-Path $package 'native-model-acceptance.exe') --list)
          if ($LASTEXITCODE -ne 0) { throw 'Hosted acceptance case inventory failed.' }
          foreach ($case in @('native_profile_selection_and_scale_receipts_preserve_bounded_scope', 'native_row4_profile_is_explicit_original_pq2_and_one_stream_only',
              'native_owned_resource_receipt_preserves_scopes_and_missing_queries',
              'native_worker_receipts_require_exact_release_and_verified_readiness',
              'speed::native_speed_metric_uses_reported_tokens_and_complete_request_time',
              'speed::native_speed_comparison_requires_matched_output_usage_and_cleanup',
              'speed::native_speed_stream_waits_for_complete_framing_and_uses_usage_not_events',
              'speed::native_speed_partial_pair_survives_cancelled_second_request',
              'speed::native_speed_profile_shares_deadline_and_rejects_extra_workloads',
              'representation::native_representation_pair_requires_completion_identity_and_cleanup',
              'representation::native_representation_comparison_requires_released_worker_observation',
              'representation::native_representation_resources_compare_matching_domains_only',
              'representation::native_representation_resources_reject_missing_or_inconsistent_observations',
              'representation::native_representation_profile_is_explicit_and_keeps_original_deadline',
              'representation::native_representation_row4_profile_is_explicit_and_preserves_pair',
              'representation::native_representation_rollback_observation_survives_pending_ptq1_arm',
              'representation::native_representation_power_gates_timing_without_erasing_answers_or_rollback',
              'representation::native_representation_profiles_leave_skipped_arms_pending_at_original_deadline',
              'representation::native_representation_complete_bytes_survive_expired_second_request',
              'progress::native_progress_decodes_fragmented_chunks_without_counting_events_as_tokens',
              'progress::native_progress_drop_retains_partial_content_without_qualifying_completion',
              'progress::native_progress_read_error_retains_partial_response_identity_before_cleanup',
              'response_capture::native_response_capture_hashes_fragmented_errors_without_retaining_payloads',
              'response_capture::native_response_capture_cancelled_read_retains_prefix_and_original_deadline',
              'response_capture::native_response_capture_caps_header_storage_and_classifies_connection_failure',
              'native_ptq1_lifecycle_minimizes_tokens_without_changing_required_steps',
              'native_ptq1_row4_lifecycle_is_explicit_and_preserves_the_required_workload',
              'native_adapter_scale_history_profile_requires_separate_explicit_selection',
              'native_adapter_scale_history_retains_partial_steps_without_qualifying_missing_work',
              'native_adapter_scale_history_requires_reported_bounded_terminal_usage',
              'native_adapter_stream_failures_retain_bound_requests_and_pending_response',
              'adapter_boundaries::native_adapter_boundary_profile_preserves_scope_and_signed_zero',
              'adapter_boundaries::native_adapter_boundary_replay_requires_bound_output_usage_and_settings',
              'adapter_boundaries::native_adapter_boundary_deadline_retains_pending_work_without_model_start',
              'adapter_boundaries::native_adapter_boundary_wire_sequence_preserves_rejections_and_failed_replay',
              'adapter_boundaries::native_adapter_context_rejection_retains_unframed_and_malformed_observations',
              'service_integration::native_service_integration_profile_preserves_bounds_and_pending_verdicts',
              'service_integration::native_pq2_service_integration_profile_preserves_original_default_and_bounds',
              'service_integration::native_pq2_service_integration_fresh_owner_reserve_keeps_original_deadline',
              'service_integration::native_service_integration_binds_prefix_and_reported_prompt_counts',
              'service_integration::native_service_integration_prefix_rejects_terminal_events_already_received',
              'service_integration::native_service_integration_cancellation_failures_return_without_unwinding',
              'service_integration::native_service_integration_cancellation_failure_retains_response_identity',
              'service_integration::native_service_integration_cleanup_preserves_failures_and_listener_observations',
              'service_integration::native_service_integration_listener_release_requires_connection_refusal',
              'service_integration::native_service_integration_stuck_owner_is_dropped_inside_existing_stop_allowance',
              'service_integration::native_service_integration_rejects_natural_completion_and_missing_rejections',
              'service_integration::native_service_integration_fresh_owner_reserve_keeps_original_deadline',
              'service_rollback::native_service_rollback_profile_is_separate_and_keeps_explicit_original_selection',
              'service_rollback::native_service_rollback_reserves_tail_before_ptq1_owner',
              'service_rollback::native_service_rollback_requires_complete_original_response_and_post_cleanup_identity',
              'service_rollback::native_service_rollback_deadline_and_missing_ptq1_cleanup_never_start_an_owner',
              'service_rollback::native_service_rollback_keeps_original_stop_and_hash_reserves',
              'service_rollback::native_service_rollback_malformed_responses_wait_for_owned_cleanup',
              'service_rollback::native_service_rollback_transport_failure_retains_pending_progress',
              'native_adapter_generated_history_requires_exact_bound_initial_output',
              'native_adapter_empty_initial_response_keeps_history_pending',
              'native_adapter_first_request_cancellation_retains_ready_phase_and_missing_work',
              'native_adapter_startup_budget_retains_pending_receipt_and_cleanup_reserve',
              'native_adapter_startup_timeout_retains_failure_before_original_deadline',
              'native_adapter_startup_error_retains_unfinished_phase_without_qualifying_cleanup',
              'native_adapter_request_budget_drops_inflight_work_before_owned_cleanup',
              'native_bounded_history_and_stall_requests_preserve_distinct_output_limits',
              'native_extended_acceptance_distinguishes_output_usage_from_delta_count',
              'native_lifecycle_observations_separate_generation_usage_and_owned_cleanup',
              'native_bounded_history_retains_completed_steps_when_followup_is_cancelled',
              'native_stalled_consumer_retains_fragmented_prefix_connection_until_dropped',
              'native_stalled_consumer_never_qualifies_natural_completion_as_interruption',
              'native_stalled_consumer_rejects_error_or_unframed_stream_headers',
              'native_case_budget_rejects_missing_unbounded_and_malformed_allowances',
              'native_case_budget_extension_requires_a_valid_predeclared_total',
              'native_case_budget_cancels_owned_tasks_before_followup')) {
            if ($modelFreeCases -cnotcontains ($case + ': test')) { throw 'Required hosted acceptance regression was not found.' }
            $output = @(& (Join-Path $package 'native-model-acceptance.exe') $case --exact)
            $code = $LASTEXITCODE
            $output | Write-Output
            & $env:BONSAI_CI_PATH native-acceptance-guard --json (@{ operation='test-output'; output=$output; exitCode=$code; expectedPassed=1 } | ConvertTo-Json -Depth 4 -Compress)
            if ($LASTEXITCODE -ne 0) { throw 'Hosted acceptance profile/argument check failed, was ignored or was not executed.' }
          }
          foreach ($case in @('pinned_native_ptq1_adapter_checks_scale_change_rejection_and_history',
              'pinned_native_ptq1_adapter_row4_checks_scale_change_rejection_and_history',
              'adapter_boundaries::pinned_native_ptq1_adapter_row4_checks_scale_boundaries_and_reset',
              'service_integration::pinned_native_ptq1_adapter_row4_checks_released_service_integration',
              'service_integration::pinned_native_pq2_adapter_row4_checks_released_service_integration',
              'service_rollback::pinned_native_ptq1_service_and_original_pq2_rollback_row4',
              'pinned_native_pq2_adapter_row4_checks_scale_change_rejection_and_history',
              'pinned_native_pq2_adapter_row4_starts_and_streams_within_device_budget',
              'representation::pinned_native_ptq1_pq2_capture_complete_responses',
              'representation::pinned_native_ptq1_pq2_row4_capture_complete_responses')) {
            if ($modelFreeCases -cnotcontains ($case + ': test')) { throw 'Required bounded lifecycle case was not found.' }
          }
          Copy-Item -LiteralPath $env:BONSAI_TOOLS_PATH -Destination (Join-Path $package 'bonsai-tools.exe')
          Copy-Item -LiteralPath $env:BONSAI_CI_PATH -Destination (Join-Path $package 'bonsai-ci.exe')
          $analyzerReceipt = Join-Path $env:BONSAI_NATIVE_ANALYZER_EVIDENCE 'rust-checks.json'
          $analyzers = Get-Content -LiteralPath $analyzerReceipt -Raw | ConvertFrom-Json
          $compilerIdentity = (& rustc +nightly-2026-11-09 -vV) -join "`n"
          & $env:BONSAI_CI_PATH native-acceptance-guard --json (@{ operation='analyzer'; receipt=$analyzers; revision=$env:GITHUB_SHA; compilerIdentity=$compilerIdentity } | ConvertTo-Json -Depth 12 -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Hosted analyzer/link receipt was rejected.' }
          $contract = Get-Content -LiteralPath $env:BONSAI_NATIVE_CONTRACT_RECEIPT -Raw | ConvertFrom-Json
          $sources = @('.github/actions/native-regressions/action.yml', '.github/workflows/native-runtime-acceptance.yml', 'scripts/Start-Chat.ps1', 'tools/ci/Cargo.toml', 'tools/ci/src/command.rs', 'tools/ci/src/native_acceptance_guard.rs') | ForEach-Object {
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes([IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $_)).Replace("`r`n", "`n"))
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            [ordered]@{ Path=$_; Bytes=$bytes.Length; Sha256=$hash }
          }
          & $env:BONSAI_CI_PATH native-acceptance-guard --json (@{ operation='workflow-receipt'; receipt=$contract; revision=$env:GITHUB_SHA; sources=@($sources) } | ConvertTo-Json -Depth 8 -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound workflow syntax/control receipt was rejected.' }
          Copy-Item -LiteralPath $analyzerReceipt -Destination (Join-Path $package 'strict-release-analyzers.json')
          Copy-Item -LiteralPath $env:BONSAI_NATIVE_CONTRACT_RECEIPT -Destination (Join-Path $package 'workflow-contract.json')
          $files = @('native-model-acceptance.exe', 'bonsai-tools.exe', 'bonsai-ci.exe', 'strict-release-analyzers.json', 'workflow-contract.json') | ForEach-Object {
            $path = Join-Path $package $_
            [ordered]@{ Name=$_; Bytes=(Get-Item -LiteralPath $path).Length; Sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          [ordered]@{
            SchemaVersion=2; Revision=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID; RunAttempt=$env:GITHUB_RUN_ATTEMPT
            Toolchain='nightly-2026-11-09-aarch64-pc-windows-msvc'; CompilerIdentity=$compilerIdentity
            ToolsSourceId=$env:BONSAI_TOOLS_SOURCE_ID; Files=@($files); ModelExecuted=$false
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $package 'receipt.json') -Encoding utf8NoBOM
          "BONSAI_ACCEPTANCE_PACKAGE=$package" >> $env:GITHUB_ENV
      - name: Retain strict Release analyzer diagnostics even when preparation fails
        if: always() && env.BONSAI_NATIVE_ANALYZER_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-analyzers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_NATIVE_ANALYZER_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain hosted compiler diagnostics even when preparation fails
        if: always() && env.BONSAI_NATIVE_BUILD_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_NATIVE_BUILD_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain public-source binaries and source/digest receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_ACCEPTANCE_PACKAGE }}
          if-no-files-found: error
          retention-days: 90

      - name: Record hosted preparation scope
        shell: pwsh
        env:
          RUN_DEVICE: ${{ inputs.run_device }}
        run: |
          if ($env:RUN_DEVICE -ceq 'true') {
            'Hosted source-bound acceptance preparation completed. The explicitly selected owner workload still requires its own bounded acceptance and independent retained-data review.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Hosted source-bound acceptance preparation completed. run_device=false schedules no owner-device job and closes no model or promotion gate. Review this exact-source package before explicitly selecting a future bounded device run; that run prepares and binds its own same-run package.' >> $env:GITHUB_STEP_SUMMARY
          }

  acceptance:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.run_device
    # Register one ephemeral Windows ARM64 owner runner with only this run label.
    # A run-specific label prevents another queued device workload from matching it.
    runs-on: ${{ format('native-acceptance-{0}', github.run_id) }}
    timeout-minutes: ${{ inputs.owner_budget_minutes == '15' && 15 || inputs.owner_budget_minutes == '10' && 10 || 5 }}
    env:
      BONSAI_NATIVE_DIAGNOSTICS_READY: 'false'
      BONSAI_NATIVE_BUDGET_MINUTES: ${{ inputs.owner_budget_minutes || '5' }}
      BONSAI_NATIVE_BUDGET_REASON: ${{ inputs.budget_reason }}
      BONSAI_NATIVE_WHOLE_JOB_SECONDS: ${{ inputs.owner_budget_minutes == '15' && 900 || inputs.owner_budget_minutes == '10' && 600 || 300 }}
    steps:
      - name: Start the complete owner-job budget before checkout and tool intake
        shell: pwsh
        run: |
          "BONSAI_NATIVE_JOB_STARTED_TICK=$([Diagnostics.Stopwatch]::GetTimestamp())" >> $env:GITHUB_ENV
          "BONSAI_NATIVE_JOB_STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
          if ($env:BONSAI_NATIVE_BUDGET_MINUTES -cnotin @('5', '10', '15')) { throw 'Select a predeclared 5, 10 or 15 minute owner budget.' }
          if ($env:BONSAI_NATIVE_BUDGET_MINUTES -cne '5' -and [string]::IsNullOrWhiteSpace($env:BONSAI_NATIVE_BUDGET_REASON)) { throw 'An extended budget requires a fixed workload estimate and reason before setup.' }
          if (([string]$env:BONSAI_NATIVE_BUDGET_REASON).Length -gt 512 -or $env:BONSAI_NATIVE_BUDGET_REASON -match '[\x00-\x1f\x7f]') { throw 'The budget reason must be at most 512 plain-text characters.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact hosted acceptance package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-acceptance-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Native-Acceptance-Package
      - name: Prepare private external working and evidence directories
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP ('Native-Runtime-Acceptance-' + [guid]::NewGuid().ToString('N'))
          foreach ($name in @('work', 'evidence')) {
            [void][IO.Directory]::CreateDirectory((Join-Path $root $name))
          }
          "BONSAI_NATIVE_WORK=$(Join-Path $root 'work')" >> $env:GITHUB_ENV
          "BONSAI_NATIVE_EVIDENCE=$(Join-Path $root 'evidence')" >> $env:GITHUB_ENV
          "BONSAI_NATIVE_DATA=$(Join-Path $env:LOCALAPPDATA 'SwiftBonsai2')" >> $env:GITHUB_ENV
          $package = Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Package'
          $receiptPath = Join-Path $package 'receipt.json'
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          $members = @(Get-ChildItem -LiteralPath $package -Force | ForEach-Object Name | Sort-Object)
          if (($members -join ',') -cne 'bonsai-ci.exe,bonsai-tools.exe,native-model-acceptance.exe,receipt.json,strict-release-analyzers.json,workflow-contract.json') { throw 'Hosted acceptance package inventory differs.' }
          if ($receipt.SchemaVersion -ne 2 -or $receipt.Revision -cne $env:GITHUB_SHA -or
              $receipt.RunId -cne $env:GITHUB_RUN_ID -or $receipt.RunAttempt -cne $env:GITHUB_RUN_ATTEMPT -or
              $receipt.Toolchain -cne 'nightly-2026-11-09-aarch64-pc-windows-msvc' -or
              $receipt.ModelExecuted -ne $false -or $receipt.ToolsSourceId -cnotmatch '^[a-f0-9]{64}$' -or
              [string]::IsNullOrWhiteSpace($receipt.CompilerIdentity) -or @($receipt.Files).Count -ne 5) { throw 'Hosted acceptance source/run identity mismatch.' }
          foreach ($name in @('native-model-acceptance.exe', 'bonsai-tools.exe', 'bonsai-ci.exe', 'strict-release-analyzers.json', 'workflow-contract.json')) {
            $matching = @($receipt.Files | Where-Object Name -CEQ $name)
            $path = Join-Path $package $name
            if ($matching.Count -ne 1 -or (Get-Item -LiteralPath $path).Length -ne $matching[0].Bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $matching[0].Sha256) { throw 'Hosted acceptance binary digest mismatch.' }
          }
          $analyzerReceiptPath = Join-Path $package 'strict-release-analyzers.json'
          $analyzers = Get-Content -LiteralPath $analyzerReceiptPath -Raw | ConvertFrom-Json
          foreach ($name in @('native-model-acceptance.exe', 'bonsai-tools.exe', 'bonsai-ci.exe')) {
            & (Join-Path $package 'bonsai-tools.exe') artifact --json (@{ operation = 'arm64'; path = (Join-Path $package $name) } | ConvertTo-Json -Compress) | Out-Null
          }
          $guard = Join-Path $package 'bonsai-ci.exe'
          & $guard native-acceptance-guard --json (@{ operation='analyzer'; receipt=$analyzers; revision=$env:GITHUB_SHA; compilerIdentity=$receipt.CompilerIdentity } | ConvertTo-Json -Depth 12 -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Hosted analyzer/link receipt was rejected before owner admission.' }
          $contractPath = Join-Path $package 'workflow-contract.json'
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          $sources = @('.github/actions/native-regressions/action.yml', '.github/workflows/native-runtime-acceptance.yml', 'scripts/Start-Chat.ps1', 'tools/ci/Cargo.toml', 'tools/ci/src/command.rs', 'tools/ci/src/native_acceptance_guard.rs') | ForEach-Object {
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes([IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $_)).Replace("`r`n", "`n"))
            $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            [ordered]@{ Path=$_; Bytes=$bytes.Length; Sha256=$hash }
          }
          & $guard native-acceptance-guard --json (@{ operation='workflow-receipt'; receipt=$contract; revision=$env:GITHUB_SHA; sources=@($sources) } | ConvertTo-Json -Depth 8 -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Hosted workflow syntax/control receipt was rejected before owner admission.' }
          Copy-Item -LiteralPath $receiptPath -Destination (Join-Path $root 'evidence/hosted-build.json')
          Copy-Item -LiteralPath $analyzerReceiptPath -Destination (Join-Path $root 'evidence/strict-release-analyzers.json')
          Copy-Item -LiteralPath $contractPath -Destination (Join-Path $root 'evidence/workflow-contract.json')
          "BONSAI_NATIVE_TEST=$(Join-Path $package 'native-model-acceptance.exe')" >> $env:GITHUB_ENV
          "BONSAI_TOOLS_PATH=$(Join-Path $package 'bonsai-tools.exe')" >> $env:GITHUB_ENV
      - name: Verify already provisioned pinned release without downloading weights
        shell: pwsh
        working-directory: ${{ env.BONSAI_NATIVE_WORK }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:BONSAI_TOOLS_PATH provision --json (@{ operation = 'inference'; dataDirectory = $env:BONSAI_NATIVE_DATA; verifyOnly = $true } | ConvertTo-Json -Compress)
      - name: Exercise actual-model broker lifecycle under the required native sandbox
        shell: pwsh
        working-directory: ${{ env.BONSAI_NATIVE_WORK }}
        env:
          BONSAI_NATIVE_PROFILE: ${{ inputs.profile }}
          BONSAI_NATIVE_EXTENDED: ${{ inputs.bounded_history }}
          BONSAI_NATIVE_STALLED_CONSUMER: ${{ inputs.stalled_consumer }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          [Environment]::CurrentDirectory = $env:BONSAI_NATIVE_WORK
          $cpu = Get-CimInstance Win32_Processor -OperationTimeoutSec 10 | Select-Object -First 1
          if ($cpu.Name -notmatch 'Snapdragon.*X.*Elite') { throw 'Actual Snapdragon X/X2 Elite identity is required; no generic ARM substitute.' }
          $hostReport = [ordered]@{
            SchemaVersion=1; Revision=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID
            RunAttempt=$env:GITHUB_RUN_ATTEMPT; Cpu=$cpu.Name
            Os=[Environment]::OSVersion.VersionString
            Architecture=[Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            Profile=$env:BONSAI_NATIVE_PROFILE
            BoundedHistoryRequested=($env:BONSAI_NATIVE_EXTENDED -eq 'true')
            StalledConsumerRequested=($env:BONSAI_NATIVE_STALLED_CONSUMER -eq 'true')
            AcceptanceProcessExitCode=$null; AggregateBudgetExpired=$false
            OwnerJobStartedTick=$env:BONSAI_NATIVE_JOB_STARTED_TICK
            OwnerJobStartedUtc=$env:BONSAI_NATIVE_JOB_STARTED_UTC
            WholeJobMaximumSeconds=[int]$env:BONSAI_NATIVE_WHOLE_JOB_SECONDS; PostProcessReserveSeconds=30
            BudgetReason=$env:BONSAI_NATIVE_BUDGET_REASON
            PreparationElapsedMilliseconds=$null; ModelCaseBudgetSeconds=$null
            PreparationWallElapsedMilliseconds=$null; PreparationMonotonicElapsedMilliseconds=$null
            TestProcessHardLimitSeconds=$null
            OwnerDeadlineApplied=$false; OwnerElapsedMilliseconds=$null
            OwnerWorkSeconds=$null; OwnerProcessExitReserveSeconds=$null
            StartupDiagnosticsReceipt='startup-diagnostics.json'
            StartupDiagnosticsReady=$false; StartupDiagnosticsClassification='not-collected'
            StartupFailureMarkers=@()
            Passed=$false; DefaultRuntimeQualified=$false
            AllRequestedWorkloadsPassed=$null
          }
          try {
            $case = switch -CaseSensitive ($env:BONSAI_NATIVE_PROFILE) {
              'pq2-no-adapter' { 'pinned_native_model_streams_recovers_and_restarts_in_required_sandbox' }
              'ptq1-adapter' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PTQ1 adapter profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_ptq1_adapter_starts_and_streams_within_device_budget'
              }
              'ptq1-adapter-lifecycle' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PTQ1 adapter scale/history profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_ptq1_adapter_checks_scale_change_rejection_and_history'
              }
              'ptq1-adapter-lifecycle-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded four-row PTQ1 adapter scale/history profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_ptq1_adapter_row4_checks_scale_change_rejection_and_history'
              }
              'ptq1-adapter-boundaries-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded four-row PTQ1 scale-boundary/reset profile does not admit extended_history or stalled_consumer.'
                }
                'adapter_boundaries::pinned_native_ptq1_adapter_row4_checks_scale_boundaries_and_reset'
              }
              'ptq1-adapter-service-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded four-row PTQ1 service-integration profile does not admit extended_history or stalled_consumer.'
                }
                'service_integration::pinned_native_ptq1_adapter_row4_checks_released_service_integration'
              }
              'ptq1-adapter-service-rollback-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PTQ1 service plus original-PQ2 rollback profile does not admit extended_history or stalled_consumer.'
                }
                'service_rollback::pinned_native_ptq1_service_and_original_pq2_rollback_row4'
              }
              'pq2-adapter-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PQ2 four-row adapter profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_pq2_adapter_row4_starts_and_streams_within_device_budget'
              }
              'pq2-adapter-lifecycle-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PQ2 adapter scale/history profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_pq2_adapter_row4_checks_scale_change_rejection_and_history'
              }
              'pq2-adapter-service-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded four-row PQ2 service-integration profile does not admit extended_history or stalled_consumer.'
                }
                'service_integration::pinned_native_pq2_adapter_row4_checks_released_service_integration'
              }
              'pq2-adapter-speed' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The paired request-throughput profile does not admit extended_history or stalled_consumer.'
                }
                'speed::pinned_native_pq2_adapter_compares_request_throughput'
              }
              'ptq1-pq2-complete-response' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The complete-response representation pair does not admit extended_history or stalled_consumer.'
                }
                'representation::pinned_native_ptq1_pq2_capture_complete_responses'
              }
              'ptq1-pq2-complete-response-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The four-worker complete-response representation pair does not admit extended_history or stalled_consumer.'
                }
                'representation::pinned_native_ptq1_pq2_row4_capture_complete_responses'
              }
              default { throw 'Unknown actual-model acceptance profile.' }
            }
            $test = $env:BONSAI_NATIVE_TEST
            $listed = @(& $test --list --ignored)
            if ($LASTEXITCODE -ne 0 -or $listed -cnotcontains ($case + ': test')) { throw 'Required actual-model case was not found.' }
            # The model owner must not inherit Actions' artifact/OIDC/GitHub
            # credentials. Scope this omission to the test child; retain the
            # complete Windows/profile environment and the production guard.
            $start = [Diagnostics.ProcessStartInfo]::new($test)
            $start.WorkingDirectory = $env:BONSAI_NATIVE_WORK
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in @($case, '--exact', '--ignored', '--nocapture')) {
              $start.ArgumentList.Add($argument)
            }
            $jobStarted = [DateTime]::Parse($env:BONSAI_NATIVE_JOB_STARTED_UTC, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
            # Charge checkout, hosted-binary intake, verification and inventory.
            # Reserve ten seconds between the Rust soft limit and process limit,
            # then thirty seconds for forced teardown, diagnostics and uploads.
            # An inherited owner clock starts before registration and may only
            # shorten these limits, preserving exit time before its watchdog.
            $ownerDeadline = @{
              RunId=$env:BONSAI_NATIVE_OWNER_RUN_ID; Revision=$env:BONSAI_NATIVE_OWNER_REVISION
              StartedTick=$env:BONSAI_NATIVE_OWNER_STARTED_TICK; StartedUtc=$env:BONSAI_NATIVE_OWNER_STARTED_UTC
              WorkSeconds=$env:BONSAI_NATIVE_OWNER_WORK_SECONDS
            }
            try {
              if (-not $env:BONSAI_TOOLS_PATH) { throw 'The source-bound hosted maintenance tool is required.' }
              if (-not $env:BONSAI_NATIVE_JOB_STARTED_TICK) { throw 'The original whole-job monotonic start is required.' }
              $budgetClock = [Diagnostics.Stopwatch]::StartNew()
              $limits = & $env:BONSAI_TOOLS_PATH native-acceptance-budget --json (@{
                jobStartedUtc=$jobStarted.ToString('o'); nowUtc=[DateTime]::UtcNow.ToString('o')
                jobStartedTick=[long]$env:BONSAI_NATIVE_JOB_STARTED_TICK
                nowTick=[Diagnostics.Stopwatch]::GetTimestamp(); tickFrequency=[Diagnostics.Stopwatch]::Frequency
                runId=$env:GITHUB_RUN_ID; revision=$env:GITHUB_SHA; ownerDeadline=$ownerDeadline
                wholeJobMaximumSeconds=[int]$env:BONSAI_NATIVE_WHOLE_JOB_SECONDS
              } | ConvertTo-Json -Depth 64 -Compress) | ConvertFrom-Json -AsHashtable
            } catch {
              $hostReport.AggregateBudgetExpired = $true
              throw
            }
            # Charge tool resolution, handshake and JSON execution after the
            # supplied clocks. IPC must never extend either original deadline.
            $budgetBridgeTick = [Diagnostics.Stopwatch]::GetTimestamp()
            $budgetBridgeElapsed = $budgetClock.Elapsed.TotalSeconds
            $budgetBridgeCharge = [int][Math]::Ceiling($budgetBridgeElapsed)
            $setupElapsed = $limits.PreparationElapsedSeconds + $budgetBridgeElapsed
            $hardLimitSeconds = $limits.HardLimitSeconds - $budgetBridgeCharge
            $caseBudgetSeconds = $limits.CaseBudgetSeconds - $budgetBridgeCharge
            # Receipt/environment preparation and process creation consume this
            # absolute limit rather than starting another relative wait.
            $processDeadlineTick = $budgetBridgeTick + ([long]$hardLimitSeconds * [Diagnostics.Stopwatch]::Frequency)
            if ($caseBudgetSeconds -lt 1) {
              $hostReport.AggregateBudgetExpired = $true
              throw 'Preparation exhausted the acceptance allowance; qualification remains pending.'
            }
            $hostReport.OwnerDeadlineApplied = $limits.OwnerDeadlineApplied
            if ($limits.OwnerDeadlineApplied) {
              $hostReport.OwnerElapsedMilliseconds = [Math]::Ceiling(($limits.OwnerElapsedSeconds + $budgetBridgeElapsed) * 1000)
              $hostReport.OwnerWorkSeconds = $limits.OwnerWorkSeconds
              $hostReport.OwnerProcessExitReserveSeconds = $limits.OwnerProcessExitReserveSeconds
            }
            $hostReport.PreparationElapsedMilliseconds = [Math]::Ceiling($setupElapsed * 1000)
            $hostReport.PreparationWallElapsedMilliseconds = [Math]::Ceiling(($limits.PreparationWallElapsedSeconds + $budgetBridgeElapsed) * 1000)
            $hostReport.PreparationMonotonicElapsedMilliseconds = [Math]::Ceiling(($limits.PreparationMonotonicElapsedSeconds + $budgetBridgeElapsed) * 1000)
            $hostReport.ModelCaseBudgetSeconds = $caseBudgetSeconds
            $hostReport.TestProcessHardLimitSeconds = $hardLimitSeconds
            $start.Environment['BONSAI_NATIVE_CASE_BUDGET_SECONDS'] = [string]$caseBudgetSeconds
            $start.Environment['BONSAI_NATIVE_WHOLE_JOB_SECONDS'] = [string]$limits.WholeJobMaximumSeconds
            foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
              [void]$start.Environment.Remove($name)
            }
            $child = [Diagnostics.Process]::Start($start)
            try {
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              $remainingMilliseconds = [int][Math]::Floor(($processDeadlineTick - [Diagnostics.Stopwatch]::GetTimestamp()) * 1000.0 / [Diagnostics.Stopwatch]::Frequency)
              if ($remainingMilliseconds -lt 1 -or -not $child.WaitForExit($remainingMilliseconds)) {
                $hostReport.AggregateBudgetExpired = $true
                throw 'The acceptance process exceeded its remaining owner-job budget.'
              }
              [Console]::Out.Write($stdout.GetAwaiter().GetResult())
              $testStderr = $stderr.GetAwaiter().GetResult()
              [Console]::Error.Write($testStderr)
              # Retain only fixed broker classifications, never arbitrary
              # test stderr or native arguments in this public JSON receipt.
              $marker = '(?m)^Native backend startup failure: stage=(authenticated-readiness|native-identity), error=(Backend|Memory|Cancelled), process=(running|status-unavailable|exited-0x[0-9A-F]{8})\r?$'
              $hostReport.StartupFailureMarkers = @([regex]::Matches($testStderr, $marker) | ForEach-Object { $_.Value.TrimEnd("`r") })
              $code = $child.ExitCode
              $hostReport.AcceptanceProcessExitCode = $code
            } finally {
              try {
                if (-not $child.HasExited) {
                  $child.Kill($true)
                  if (-not $child.WaitForExit(10000)) { throw 'Native acceptance cleanup did not finish within ten seconds.' }
                }
              } finally { $child.Dispose() }
            }
            if ($code -ne 0) { throw 'Actual-model application acceptance failed.' }
            $receipt = Join-Path $env:BONSAI_NATIVE_EVIDENCE 'acceptance.json'
            if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw 'Actual-model acceptance receipt is missing.' }
            $hostReport.Passed = $true
          } finally {
            $env:BONSAI_NATIVE_DIAGNOSTICS_READY = 'false'
            $env:BONSAI_NATIVE_DIAGNOSTICS_STATUS = 'collection-failed'
            'BONSAI_NATIVE_DIAGNOSTICS_READY=false' >> $env:GITHUB_ENV
            try {
              if (-not $env:BONSAI_TOOLS_PATH) { throw 'The source-bound hosted maintenance tool is required.' }
              $diagnostics = & $env:BONSAI_TOOLS_PATH startup-diagnostics --json (@{
                evidenceDirectory=$env:BONSAI_NATIVE_EVIDENCE
                acceptanceExitCode=$hostReport.AcceptanceProcessExitCode; budgetExpired=$hostReport.AggregateBudgetExpired
              } | ConvertTo-Json -Depth 64 -Compress) | ConvertFrom-Json -AsHashtable
              # Recover the bounded typed workload result even when the test
              # exits 101 after retaining partial progress and owned cleanup.
              # Missing/malformed receipts remain unknown; this never changes
              # Passed or the original failing process disposition.
              if ($env:BONSAI_NATIVE_PROFILE -cin @('pq2-no-adapter', 'pq2-adapter-lifecycle-row4', 'pq2-adapter-service-row4', 'ptq1-adapter-lifecycle', 'ptq1-adapter-lifecycle-row4', 'ptq1-adapter-boundaries-row4', 'ptq1-adapter-service-row4', 'ptq1-adapter-service-rollback-row4') -and
                  $diagnostics.AllRequestedWorkloadsPassed -is [bool]) {
                $hostReport.AllRequestedWorkloadsPassed = $diagnostics.AllRequestedWorkloadsPassed
              }
              $env:BONSAI_NATIVE_DIAGNOSTICS_READY = if ($diagnostics.Ready -ceq $true) { 'true' } else { 'false' }
              $env:BONSAI_NATIVE_DIAGNOSTICS_STATUS = $diagnostics.Classification
            } catch {
              # Keep collection errors value-free: paths and raw tool diagnostics
              # must never enter the public host receipt or diagnostic upload.
              $env:BONSAI_NATIVE_DIAGNOSTICS_READY = 'false'
              $env:BONSAI_NATIVE_DIAGNOSTICS_STATUS = 'collection-failed'
            } finally {
              $hostReport.StartupDiagnosticsReady = $env:BONSAI_NATIVE_DIAGNOSTICS_READY -ceq 'true'
              $hostReport.StartupDiagnosticsClassification = $env:BONSAI_NATIVE_DIAGNOSTICS_STATUS
              ('BONSAI_NATIVE_DIAGNOSTICS_READY=' + $env:BONSAI_NATIVE_DIAGNOSTICS_READY) >> $env:GITHUB_ENV
              $hostReport | ConvertTo-Json -Depth 4 |
                Set-Content -LiteralPath (Join-Path $env:BONSAI_NATIVE_EVIDENCE 'host.json') -Encoding utf8NoBOM
            }
          }
          $profileScope = if ($env:BONSAI_NATIVE_PROFILE -ceq 'ptq1-adapter') {
            'PTQ1 with the approved adapter requires one scale-1.3 four-token stream; scale-zero and invalid-scale/reuse checks run only within the same budget. Unrun multi-scale, history, context and restart gates remain pending.'
          } elseif ($env:BONSAI_NATIVE_PROFILE -cin @('ptq1-adapter-lifecycle', 'ptq1-adapter-lifecycle-row4')) {
            $workers = if ($env:BONSAI_NATIVE_PROFILE -ceq 'ptq1-adapter-lifecycle-row4') { 'four' } else { 'one' }
            ('Current-weight PTQ1 with ' + $workers + ' explicitly configured row workers requires three one-token-cap streams: scale 1.3, scale zero, then scale 1.3 with the exact captured initial response supplied as assistant history after invalid-scale connection closure without a response, all in the same owner. Text, SHA-256, source messages, finish reason and usage bind that history; missing visible output keeps acceptance pending. Each further request requires more than 45 seconds remaining; a request timeout reserves 30 seconds for owned cleanup. Any missing required step remains pending and fails after cleanup. One-worker and four-worker evidence remain separate. This does not prove zero/no-adapter logits identity, generated-history state reuse or parity, numerical parity, quality or TPS.')
          } elseif ($env:BONSAI_NATIVE_PROFILE -cin @('ptq1-adapter-service-row4', 'pq2-adapter-service-row4')) {
            $representation = if ($env:BONSAI_NATIVE_PROFILE -ceq 'pq2-adapter-service-row4') { 'Original PQ2' } else { 'Current-weight PTQ1' }
            ($representation + ' with four row workers combines scale-1.3, negative-zero and scale-two cap-one streams, invalid-scale/context rejection, explicit Stop after a nonempty complete SSE content record from the same scale-1.3 prompt, then fresh verified ownership and exact cap-one scale-1.3 replay. Same-owner prefix equality is informational because sampler draws advance. Counts, requests, output, credential replacement and both owned cleanups remain distinct. A terminal event already received cannot qualify cancellation; broker operation counters must retain exactly three completed and three failed operations, including the two rejections and interruption. Fresh startup requires more than 60 seconds remaining and all request/start work shares the original deadline minus 30 seconds for owned cleanup. Missing work stays pending. Matching reported prompt counts plus the source-bound identical count/generation body contract are not a private wire capture, server per-request scale acknowledgement, numerical adapter effect or complete state parity. Independent retained-data/source review must decide the service gate; full promotion, performance, provenance and quality remain pending.')
          } elseif ($env:BONSAI_NATIVE_PROFILE -ceq 'ptq1-adapter-service-rollback-row4') {
            'One explicit pinned-Prism workload retains the five-request PTQ1 scale-boundary/Stop/fresh-seeded-replay sequence, then only after both PTQ1 Jobs and listeners are reaped starts original PQ2 explicitly with the same released runtime, adapter 1.3 and four workers. The original-PQ2 arm must naturally complete the existing fixed tree-name request within its 32-token cap, release its Job/listener with one completed operation and no failures, then re-verify the entire retained original file length and CNG SHA-256. Rust power endpoints cover the model case and each owner; pre-setup aggregate conditions require separately retained owner observations and remain unknown otherwise. PTQ1 uses an earlier deadline withholding the 75-second rollback tail, and admission rejects before its first owner when at most 135 seconds remain. The third startup requires more than 75 seconds remaining; its requests reserve the existing 30 seconds for owned cleanup plus 15 seconds for post-cleanup full-file verification, all against the original absolute deadline. Only connection refusal confirms listener release; other probe failures stay unknown. Partial service and rollback receipts remain separate; neither a skipped rollback nor a retained hash qualifies the whole case. No performance/resource benefit, numerical/full-context parity, quality, comfort or default promotion is claimed.'
          } elseif ($env:BONSAI_NATIVE_PROFILE -ceq 'pq2-adapter-row4') {
            'Original PQ2 with the approved adapter explicitly configures four native row workers and requires exactly one scale-1.3 four-token-cap stream, verified model/adapter readiness and owned cleanup. This does not independently observe thread count or establish TPS. Multi-scale, rejection/reuse, history, context, restart, performance and quality gates remain unrun.'
          } elseif ($env:BONSAI_NATIVE_PROFILE -ceq 'pq2-adapter-lifecycle-row4') {
            'Original PQ2 with four row workers requires scale-1.3 and scale-zero streams, invalid-scale connection closure without a response, then scale-1.3 streaming with the exact captured initial response supplied as assistant history in the same owner. Text, SHA-256, source messages, finish reason and usage bind that history; missing visible output keeps acceptance pending. Each further request requires more than 45 seconds remaining; a request timeout reserves 30 seconds for owned cleanup. Any missing required step remains pending and fails after cleanup. This does not prove zero/no-adapter logits identity, generated-history state reuse or parity, numerical parity, quality or TPS.'
          } elseif ($env:BONSAI_NATIVE_PROFILE -ceq 'pq2-adapter-speed') {
            'One fixed-order paired request measures original PQ2 with adapter 1.3 and one versus four workers, each in a fresh owner, using identical eight-token-cap counting prompts and seed 42. Request TPS includes prefill and complete HTTP response delivery, excludes startup, and is not device decode TPS. A ratio requires reported usage at the cap, identical visible output and both owned cleanups. No retry, repeated-trial benefit or default promotion is qualified.'
          } elseif ($env:BONSAI_NATIVE_PROFILE -cin @('ptq1-pq2-complete-response', 'ptq1-pq2-complete-response-row4')) {
            $workers = if ($env:BONSAI_NATIVE_PROFILE -ceq 'ptq1-pq2-complete-response-row4') { 'four row workers' } else { 'one row worker' }
            ('One fixed-order original-PQ2/current-weight-PTQ1 pair captures complete responses to a short public tree-naming prompt, each with adapter 1.3, ' + $workers + ', production sampler and seed 42 in a fresh required-sandbox owner. Both must stop naturally within a 32-token cap, report usage and release their owned Job and listener. Exact UTF-8 responses and SHA-256 are retained, including losing or truncated completed captures. Latency and scoped resource ratios require identical output and usage; absent or inconsistent resource telemetry leaves the resource comparison pending. Job lifetime commitment, root lifetime residency and sampled serving bounds remain separate. Every startup requires more than 60 seconds remaining, requests reserve 30 seconds for cleanup, and an incomplete pair stays pending; no continuation jobs may split the matrix. One-worker and four-worker evidence remain separate. This is feasibility evidence only; repeated trials, full-context resources, paging, decode TPS, adapter baseline/zero controls, quality, numerical parity, comfort and default promotion remain pending.')
          } else {
            'No adapter was enabled. Full-context numerical/resource, performance, quality and daily-service qualification remain separate.'
          }
          @('Bounded actual-model Rust application lifecycle passed under required native containment.',
            ('Explicit acceptance profile: ' + $env:BONSAI_NATIVE_PROFILE),
            "All setup, model loading, execution and cleanup share one predeclared $env:BONSAI_NATIVE_BUDGET_MINUTES-minute job (five preferred, fifteen maximum). Actual-model cases reserve sixty seconds from that total and are further reduced by checkout, intake and verification time. Inherited shorter owner clocks and separate teardown/evidence reserves still apply. Do not split a matrix into repeated jobs.",
            ('Bounded supplied history (128 repetitions, four-token cap) requested: ' + $env:BONSAI_NATIVE_EXTENDED),
            ('Explicit Stop with a nonreading connected client requested: ' + $env:BONSAI_NATIVE_STALLED_CONSUMER),
            'The stalled-client workload requires an interrupted broker operation, bounded owned shutdown and fresh-owner recovery; it does not prove socket-buffer saturation or that the backend was still generating at Stop.',
            'Bounded history records framing, termination and reported output usage. The stalled request reserves 4096 tokens but Stop follows its first visible prefix; neither workload proves 4096 generated tokens or exact 8K occupancy.',
            'Each optional workload requires more than 120 seconds remaining for cleanup and fresh-owner recovery; skipped requests remain pending. Read allRequestedWorkloadsPassed independently of lifecycle success in acceptance.json.',
            $profileScope,
            'This workflow cannot promote the default runtime.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain only credential-free acceptance receipts
        if: always() && env.BONSAI_NATIVE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          # Protected child directories contain keys. Never upload recursively.
          path: |
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/acceptance.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/host.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/hosted-build.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/strict-release-analyzers.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/workflow-contract.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain only verified regular sanitized diagnostic files
        if: always() && env.BONSAI_NATIVE_DIAGNOSTICS_READY == 'true' && env.BONSAI_NATIVE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-startup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          # A failed/unsafe collection skips this entire artifact, including JSON.
          path: |
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/startup-diagnostics.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/startup-backend.stdout.txt
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/startup-backend.stderr.txt
          if-no-files-found: error
          retention-days: 90
