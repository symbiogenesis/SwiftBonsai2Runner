name: Native and Rust PTQ1 five-minute smoke
on:
  workflow_dispatch:
    inputs:
      run_device:
        description: Run the single five-minute owner-device trial after hosted preparation
        type: boolean
        default: false
      rust_backend:
        description: One Rust backend for the bounded one-token capture; broader qualification remains pending
        type: choice
        options: [auto, scalar, neon]
        default: auto
permissions:
  contents: read
concurrency:
  group: swift-lora-snapdragon
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Check the hosted-only build boundary
        shell: pwsh
        run: ./tests/Test-NativePtq1CaptureTools.ps1 -Case HostedGuard
      - name: Check collector receipt and complete ABI observation rejection
        shell: pwsh
        run: ./tests/Test-NativePtq1CaptureTools.ps1 -Case CollectorControls
      - name: Check bounded compiler and failure evidence
        shell: pwsh
        run: ./tests/Test-NativePtq1CaptureTools.ps1 -Case BuildEvidence
      - name: Reject stale runtime source and missing owner allowances
        shell: pwsh
        run: ./tests/Test-NativePtq1CaptureTools.ps1 -Case CapturePolicy
      - name: Validate fixed native-state decoding and control binding
        shell: pwsh
        run: >-
          python -B tools/native-reference/test_compare.py
          NativeStateTests.test_transposed_v_and_complete_recurrent_inventory_match_logical_rows
          NativeStateTests.test_state_decoder_rejects_truncation_trailing_bytes_and_changed_schema
          NativeStateTests.test_comparator_enforces_finite_values_exact_extents_and_original_tolerance
          NativeStateTests.test_control_binding_rejects_changed_adapter_scale_tokens_and_backend
          NativeStateTests.test_explicit_backend_controls_reject_substitution_and_unknown_backends
          NativeStateTests.test_capture_pre_read_bounds_reject_oversized_json_and_logits
      - name: Prepare exact capture binaries and maintenance receipt without models
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $capture = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Ptq1CaptureTools'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-NativePtq1CaptureTools.ps1') -OutputDirectory $capture | ConvertTo-Json -Depth 5
          $package = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CheckedTools'
          [void][IO.Directory]::CreateDirectory($package)
          $tool = Join-Path $package 'bonsai-tools.exe'
          $probe = Join-Path $package 'bonsai-completion-test-probe.exe'
          Copy-Item -LiteralPath $env:BONSAI_TOOLS_PATH -Destination $tool
          Copy-Item -LiteralPath $env:BONSAI_COMPLETION_PROBE_PATH -Destination $probe
          @{
            SchemaVersion = 2; Revision = $env:GITHUB_SHA
            Sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
            ProbeSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'receipt.json') -Encoding utf8NoBOM
      - name: Retain bounded hosted compiler and collector-test evidence
        if: always() && env.BONSAI_PTQ1_BUILD_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptq1-collector-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_PTQ1_BUILD_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
      - name: Share source-bound capture binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptq1-capture-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-Ptq1CaptureTools
          if-no-files-found: error
          retention-days: 90
      - name: Share checked maintenance tools for this source revision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/SwiftBonsai-CheckedTools
          if-no-files-found: error
          retention-days: 90
  numerics:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.run_device
    # Register one ephemeral runner with only this run's qualification label.
    runs-on: ${{ format('ptq1-numerics-{0}', github.run_id) }}
    timeout-minutes: 5
    steps:
      - name: Start the complete owner-job budget before checkout and tool intake
        shell: pwsh
        run: |
          "BONSAI_PTQ1_JOB_STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/use-bonsai-tools
      - name: Download this run's source-bound capture tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ptq1-capture-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-Ptq1CaptureTools
      - name: Capture and compare the fixed one-token smoke
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          BONSAI_PTQ1_RUST_BACKEND: ${{ inputs.rust_backend }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:BONSAI_PTQ1_RUST_BACKEND -cnotin @('auto', 'scalar', 'neon')) { throw 'Select one explicit supported Rust capture backend.' }
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Tools.psm1')
          $budgetPath = Join-Path $env:RUNNER_TEMP 'ptq1-owner-budget.json'
          $budgetReport = [ordered]@{
            Revision=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID; RunAttempt=$env:GITHUB_RUN_ATTEMPT
            Status='preparing'; WholeJobMaximumSeconds=300; DefaultMayChange=$false
          }
          $budgetReport | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $budgetPath -Encoding utf8NoBOM
          "BONSAI_PTQ1_OWNER_BUDGET=$budgetPath" >> $env:GITHUB_ENV
          try {
            $budgetTick = [Diagnostics.Stopwatch]::GetTimestamp()
            $frequency = [Diagnostics.Stopwatch]::Frequency
            $limits = Invoke-BonsaiTool -Command native-acceptance-budget -ToolPath $env:BONSAI_TOOLS_PATH -TimeoutSeconds 10 -Request @{
              jobStartedUtc=$env:BONSAI_PTQ1_JOB_STARTED_UTC; nowUtc=[DateTime]::UtcNow.ToString('o')
              nowTick=$budgetTick; tickFrequency=$frequency
              runId=$env:GITHUB_RUN_ID; revision=$env:GITHUB_SHA
              ownerDeadline=@{
                RunId=$env:BONSAI_NATIVE_OWNER_RUN_ID; Revision=$env:BONSAI_NATIVE_OWNER_REVISION
                StartedTick=$env:BONSAI_NATIVE_OWNER_STARTED_TICK; StartedUtc=$env:BONSAI_NATIVE_OWNER_STARTED_UTC
                WorkSeconds=$env:BONSAI_NATIVE_OWNER_WORK_SECONDS
              }
            }
            # Absolute monotonic deadlines include IPC, receipts and process startup.
            $workSeconds = $limits.CaseBudgetSeconds
            $workDeadline = $budgetTick + ([long]$workSeconds * $frequency)
            $hardDeadline = $budgetTick + ([long]$limits.HardLimitSeconds * $frequency)
            $budgetReport.Status = 'budget-established'
            $budgetReport['Limits'] = $limits; $budgetReport['WorkBudgetSeconds'] = $workSeconds
            $budgetReport['WorkDeadlineTick'] = $workDeadline; $budgetReport['HardDeadlineTick'] = $hardDeadline
          } catch {
            $budgetReport.Status = 'budget-rejected'
            throw
          } finally {
            $budgetReport | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $budgetPath -Encoding utf8NoBOM
          }
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $PSHOME 'pwsh.exe'))
          $start.WorkingDirectory = $env:RUNNER_TEMP
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          # A hosted preparation job supplies the checked capture and maintenance
          # tools. Owner-laptop builds/downloads are intentionally unavailable.
          foreach ($argument in @('-NoProfile', '-File', (Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-NativePtq1Numerics.ps1'), '-DataDirectory', (Join-Path $env:LOCALAPPDATA 'SwiftBonsai2'), '-CaptureToolsDirectory', (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Ptq1CaptureTools'), '-WorkBudgetSeconds', [string]$workSeconds, '-WorkDeadlineTick', [string]$workDeadline, '-RustBackend', $env:BONSAI_PTQ1_RUST_BACKEND)) {
            $start.ArgumentList.Add($argument)
          }
          foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
            [void]$start.Environment.Remove($name)
          }
          $child = [Diagnostics.Process]::Start($start)
          try {
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            $hardMilliseconds = [int][Math]::Floor(($hardDeadline - [Diagnostics.Stopwatch]::GetTimestamp()) * 1000.0 / $frequency)
            if ($hardMilliseconds -lt 1 -or -not $child.WaitForExit($hardMilliseconds)) { throw 'The complete PTQ1 smoke exceeded its remaining owner-job process budget.' }
            [Console]::Out.Write($stdout.GetAwaiter().GetResult())
            [Console]::Error.Write($stderr.GetAwaiter().GetResult())
            $code = $child.ExitCode
          } finally {
            try {
              if (-not $child.HasExited) {
                $child.Kill($true)
                if (-not $child.WaitForExit(10000)) { throw 'PTQ1 smoke cleanup did not finish within ten seconds.' }
              }
            } finally { $child.Dispose() }
          }
          if ($code -ne 0) { throw 'PTQ1 numerical capture/comparison failed; inspect retained evidence.' }
          @('One supplied token [248045], exact current-weight PTQ1 and approved adapter at 1.3.',
            "One native reference process and one Rust $env:BONSAI_PTQ1_RUST_BACKEND process; at most 240 seconds reduced by all checkout, intake and setup costs inside this five-minute job.",
            'All logits and complete logical KV/convolution/recurrent values use the unchanged tolerance.',
            'No-adapter, loaded zero, nonzero-change, broader scalar/explicit-NEON trajectories, writer authoring basis, quality, performance and full context remain pending.',
            'A selected-backend smoke cannot be split into repeated owner-device runs to bypass the aggregate five-minute budget.',
            'No default or admission change is authorized.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain complete owner-job budget attribution
        if: always() && env.BONSAI_PTQ1_OWNER_BUDGET != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptq1-owner-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_PTQ1_OWNER_BUDGET }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded numerical evidence and failures
        if: always() && env.BONSAI_PTQ1_NUMERICS_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ptq1-numerics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/numerics.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/comparison.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/comparison.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/capture-tools.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-preflight/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-preflight/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-observations/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-observations/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.native-seq
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/state-0/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/state-0/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/state-0/*.f32le
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
