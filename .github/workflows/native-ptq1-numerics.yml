name: Native and Rust PTQ1 five-minute smoke
on:
  workflow_dispatch:
    inputs:
      run_device:
        description: Run the single five-minute owner-device trial after hosted preparation
        type: boolean
        default: false
      capture_mode:
        description: Numerical native/Rust pair or one owned source-session request timing; never both
        type: choice
        options: [numerical, request-timing]
        default: numerical
      rust_backend:
        description: One Rust backend for the bounded one-token capture; broader qualification remains pending
        type: choice
        options: [auto, scalar, neon]
        default: auto
      native_row_workers:
        description: One exact Rust row-worker policy; qualification does not transfer between worker counts
        type: choice
        options: ['1', '4']
        default: '1'
      adapter_condition:
        description: One numerical-pair adapter condition; request timing requires standard
        type: choice
        options: [standard, loaded-zero, no-adapter]
        default: standard
permissions:
  contents: read
concurrency:
  # Tool-only preparation uses no physical device and must not occupy its lane.
  group: ${{ inputs.run_device && 'swift-lora-snapdragon' || format('ptq1-tools-hosted-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-02-aarch64-pc-windows-msvc
      - name: Check native hosted build policy and bounded failure evidence
        shell: pwsh
        run: |
          cargo +nightly-2026-11-02 test --locked --release --target-dir $env:BONSAI_TOOLS_TARGET -p bonsai-tools --lib build_tools::
      - name: Check native source, receipt and original-deadline policy
        shell: pwsh
        run: >-
          cargo +nightly-2026-11-02 test --locked --release --target-dir $env:BONSAI_TOOLS_TARGET -p bonsai-tools --lib native_qualification::
      - name: Bind the selected capture mode before owner preparation
        shell: pwsh
        env:
          BONSAI_PTQ1_CAPTURE_MODE: ${{ inputs.capture_mode }}
          BONSAI_PTQ1_RUST_BACKEND: ${{ inputs.rust_backend }}
          BONSAI_PTQ1_ROW_WORKERS: ${{ inputs.native_row_workers }}
          BONSAI_PTQ1_ADAPTER_CONDITION: ${{ inputs.adapter_condition }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $plan = & $env:BONSAI_TOOLS_PATH native-qualification --json (@{
            operation='plan'; kind='ptq1'; captureMode=$env:BONSAI_PTQ1_CAPTURE_MODE
            repositoryDirectory=$env:GITHUB_WORKSPACE; rustBackend=$env:BONSAI_PTQ1_RUST_BACKEND
            rowWorkers=[int]$env:BONSAI_PTQ1_ROW_WORKERS; adapterCondition=$env:BONSAI_PTQ1_ADAPTER_CONDITION
          } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($plan.CaptureMode -cne $env:BONSAI_PTQ1_CAPTURE_MODE -or $plan.ModelProcessStarted -or $plan.DefaultMayChange) { throw 'Capture mode planning failed closed.' }
          if ($env:BONSAI_PTQ1_CAPTURE_MODE -ceq 'request-timing' -and ($plan.NativeSamples -ne 0 -or $plan.RustSamples -ne 1 -or $plan.OutputTokens -ne 1)) { throw 'Request timing must select one bounded Rust source-session request only.' }
      - name: Validate fixed native-state decoding and control binding
        shell: pwsh
        run: >-
          python -B tools/native-reference/test_compare.py
          NativeStateTests.test_transposed_v_and_complete_recurrent_inventory_match_logical_rows
          NativeStateTests.test_state_decoder_rejects_truncation_trailing_bytes_and_changed_schema
          NativeStateTests.test_comparator_enforces_finite_values_exact_extents_and_original_tolerance
          NativeStateTests.test_exact_chunks_reject_nonfinite_values_and_preserve_signed_zero
          NativeStateTests.test_control_binding_rejects_changed_adapter_scale_tokens_and_backend
          NativeStateTests.test_explicit_backend_controls_reject_substitution_and_unknown_backends
          NativeStateTests.test_row_worker_controls_reject_cross_worker_and_missing_parallel_execution
          NativeStateTests.test_selected_adapter_condition_binds_loading_scale_and_rust_identity
          NativeStateTests.test_capture_pre_read_bounds_reject_oversized_json_and_logits
      - name: Prepare exact capture binaries and maintenance receipt without models
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $capture = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Ptq1CaptureTools'
          & $env:BONSAI_TOOLS_PATH build-tools --json (@{ operation = 'ptq1-capture'; repositoryRoot = $env:GITHUB_WORKSPACE; outputDirectory = $capture } | ConvertTo-Json -Compress)
          $package = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CheckedTools'
          [void][IO.Directory]::CreateDirectory($package)
          $tool = Join-Path $package 'bonsai-tools.exe'
          $probe = Join-Path $package 'bonsai-completion-test-probe.exe'
          Copy-Item -LiteralPath $env:BONSAI_TOOLS_PATH -Destination $tool
          Copy-Item -LiteralPath $env:BONSAI_COMPLETION_PROBE_PATH -Destination $probe
          @{
            SchemaVersion = 2; Revision = $env:GITHUB_SHA
            Sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
            ProbeSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'receipt.json') -Encoding utf8NoBOM
      - name: Retain bounded hosted compiler and collector-test evidence
        if: always() && env.BONSAI_PTQ1_BUILD_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptq1-collector-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_PTQ1_BUILD_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
      - name: Share source-bound capture binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptq1-capture-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-Ptq1CaptureTools
          if-no-files-found: error
          retention-days: 90
      - name: Share checked maintenance tools for this source revision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/SwiftBonsai-CheckedTools
          if-no-files-found: error
          retention-days: 90
  numerics:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.run_device
    # Register one ephemeral runner with only this run's qualification label.
    runs-on: ${{ format('ptq1-numerics-{0}', github.run_id) }}
    timeout-minutes: 5
    steps:
      - name: Start the complete owner-job budget before checkout and tool intake
        shell: pwsh
        run: |
          "BONSAI_PTQ1_JOB_STARTED_TICK=$([Diagnostics.Stopwatch]::GetTimestamp())" >> $env:GITHUB_ENV
          "BONSAI_PTQ1_JOB_STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/use-bonsai-tools
      - name: Download this run's source-bound capture tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ptq1-capture-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-Ptq1CaptureTools
      - name: Execute only the explicitly selected bounded capture
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          BONSAI_PTQ1_CAPTURE_MODE: ${{ inputs.capture_mode }}
          BONSAI_PTQ1_RUST_BACKEND: ${{ inputs.rust_backend }}
          BONSAI_PTQ1_ROW_WORKERS: ${{ inputs.native_row_workers }}
          BONSAI_PTQ1_ADAPTER_CONDITION: ${{ inputs.adapter_condition }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:BONSAI_PTQ1_CAPTURE_MODE -cnotin @('numerical', 'request-timing')) { throw 'Select one exact capture mode.' }
          if ($env:BONSAI_PTQ1_RUST_BACKEND -cnotin @('auto', 'scalar', 'neon')) { throw 'Select one explicit supported Rust capture backend.' }
          if ($env:BONSAI_PTQ1_ROW_WORKERS -cnotin @('1', '4')) { throw 'Select one exact Rust capture row-worker count.' }
          if ($env:BONSAI_PTQ1_ADAPTER_CONDITION -cnotin @('standard', 'loaded-zero', 'no-adapter')) { throw 'Select one exact adapter condition.' }
          if ($env:BONSAI_PTQ1_CAPTURE_MODE -ceq 'request-timing' -and $env:BONSAI_PTQ1_ADAPTER_CONDITION -cne 'standard') { throw 'Request timing requires the standard adapter at scale 1.3.' }
          $budgetPath = Join-Path $env:RUNNER_TEMP 'ptq1-owner-budget.json'
          $budgetReport = [ordered]@{
            Revision=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID; RunAttempt=$env:GITHUB_RUN_ATTEMPT
            Status='preparing'; CaptureMode=$env:BONSAI_PTQ1_CAPTURE_MODE; WholeJobMaximumSeconds=300; DefaultMayChange=$false
          }
          $budgetReport | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $budgetPath -Encoding utf8NoBOM
          "BONSAI_PTQ1_OWNER_BUDGET=$budgetPath" >> $env:GITHUB_ENV
          try {
            if ([string]::IsNullOrWhiteSpace($env:BONSAI_PTQ1_JOB_STARTED_TICK)) { throw 'The original monotonic job start is required.' }
            $budgetTick = [Diagnostics.Stopwatch]::GetTimestamp()
            $frequency = [Diagnostics.Stopwatch]::Frequency
            $limits = & $env:BONSAI_TOOLS_PATH native-acceptance-budget --json (@{
              jobStartedUtc=$env:BONSAI_PTQ1_JOB_STARTED_UTC; nowUtc=[DateTime]::UtcNow.ToString('o')
              jobStartedTick=[long]$env:BONSAI_PTQ1_JOB_STARTED_TICK
              nowTick=$budgetTick; tickFrequency=$frequency
              runId=$env:GITHUB_RUN_ID; revision=$env:GITHUB_SHA
              ownerDeadline=@{
                RunId=$env:BONSAI_NATIVE_OWNER_RUN_ID; Revision=$env:BONSAI_NATIVE_OWNER_REVISION
                StartedTick=$env:BONSAI_NATIVE_OWNER_STARTED_TICK; StartedUtc=$env:BONSAI_NATIVE_OWNER_STARTED_UTC
                WorkSeconds=$env:BONSAI_NATIVE_OWNER_WORK_SECONDS
              }
            } | ConvertTo-Json -Depth 64 -Compress) | ConvertFrom-Json -AsHashtable
            # Absolute monotonic deadlines include IPC, receipts and process startup.
            $workSeconds = $limits.CaseBudgetSeconds
            $workDeadline = $budgetTick + ([long]$workSeconds * $frequency)
            $hardDeadline = $budgetTick + ([long]$limits.HardLimitSeconds * $frequency)
            $budgetReport.Status = 'budget-established'
            $budgetReport['Limits'] = $limits; $budgetReport['WorkBudgetSeconds'] = $workSeconds
            $budgetReport['WorkDeadlineTick'] = $workDeadline; $budgetReport['HardDeadlineTick'] = $hardDeadline
          } catch {
            $budgetReport.Status = 'budget-rejected'
            throw
          } finally {
            $budgetReport | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $budgetPath -Encoding utf8NoBOM
          }
          $requestPath = Join-Path $env:RUNNER_TEMP 'native-ptq1-request.json'
          $caller = [Diagnostics.Process]::GetCurrentProcess()
          try { $callerCreation = $caller.StartTime.ToUniversalTime().ToFileTimeUtc() } finally { $caller.Dispose() }
          @{ operation='capture'; kind='ptq1'; repositoryDirectory=$env:GITHUB_WORKSPACE
            captureMode=$env:BONSAI_PTQ1_CAPTURE_MODE
            dataDirectory=(Join-Path $env:LOCALAPPDATA 'SwiftBonsai2')
            captureToolsDirectory=(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Ptq1CaptureTools')
            workBudgetSeconds=$workSeconds; workDeadlineTick=$workDeadline
            rustBackend=$env:BONSAI_PTQ1_RUST_BACKEND; rowWorkers=[int]$env:BONSAI_PTQ1_ROW_WORKERS
            adapterCondition=$env:BONSAI_PTQ1_ADAPTER_CONDITION
            parentProcessId=$PID; parentCreationTimeFileTime=$callerCreation
          } | ConvertTo-Json | Set-Content -LiteralPath $requestPath -Encoding utf8NoBOM
          $start = [Diagnostics.ProcessStartInfo]::new($env:BONSAI_TOOLS_PATH)
          $start.WorkingDirectory = $env:RUNNER_TEMP
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          # A hosted preparation job supplies the checked capture and maintenance
          # tools. Owner-laptop builds/downloads are intentionally unavailable.
          foreach ($argument in @('native-qualification', '--request', $requestPath)) {
            $start.ArgumentList.Add($argument)
          }
          foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
            [void]$start.Environment.Remove($name)
          }
          $child = [Diagnostics.Process]::Start($start)
          try {
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            $hardMilliseconds = [int][Math]::Floor(($hardDeadline - [Diagnostics.Stopwatch]::GetTimestamp()) * 1000.0 / $frequency)
            if ($hardMilliseconds -lt 1 -or -not $child.WaitForExit($hardMilliseconds)) { throw 'The complete PTQ1 smoke exceeded its remaining owner-job process budget.' }
            [Console]::Out.Write($stdout.GetAwaiter().GetResult())
            [Console]::Error.Write($stderr.GetAwaiter().GetResult())
            $code = $child.ExitCode
          } finally {
            try {
              if (-not $child.HasExited) {
                $child.Kill($true)
                if (-not $child.WaitForExit(10000)) { throw 'PTQ1 smoke cleanup did not finish within ten seconds.' }
              }
            } finally { $child.Dispose() }
          }
          if ($code -ne 0) { throw 'The selected PTQ1 capture failed; inspect retained evidence.' }
          if ($env:BONSAI_PTQ1_CAPTURE_MODE -ceq 'request-timing') {
            @("One owned Rust $env:BONSAI_PTQ1_RUST_BACKEND source-session request, $env:BONSAI_PTQ1_ROW_WORKERS row workers, current PTQ1 and standard adapter 1.3; no native reference model or ABI process executes.",
              'The fixed public tree-name messages use thinking disabled, seed 42, production sampler/stops, no prefix reuse, at most 128 rendered prompt tokens and one reserved output token. A sampled stop may commit zero output tokens.',
              'Exact source/executable/input/model/adapter/settings/deadline identities and returned operation counters/timings are verified against retained native supervision and raw started/final receipts.',
              'The original owner clock covers intake, admission, hashing, loading, work and cleanup; 32 seconds remain for verification and owned cleanup. Missing or empty final receipts leave work unknown.',
              'Source-session brackets include checks and allocation with a no-op text consumer; no HTTP throughput, isolated kernel timing, complete-answer quality, released-service qualification or default promotion is established.',
              'No additional numerical capture or continuation job runs.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            @("One supplied token [248045], exact current-weight PTQ1; adapter condition: $env:BONSAI_PTQ1_ADAPTER_CONDITION (standard is 1.3; loaded-zero loads the approved adapter at zero; no-adapter omits it).",
            "One native reference process and one Rust $env:BONSAI_PTQ1_RUST_BACKEND process; at most 240 seconds reduced by all checkout, intake and setup costs inside this five-minute job.",
            "Rust row workers: $env:BONSAI_PTQ1_ROW_WORKERS; exact worker count and actual parallel operations are checked independently of backend selection. Other worker policies remain unqualified.",
            'All logits and complete logical KV/convolution/recurrent values use the unchanged tolerance.',
            'This one condition does not establish cross-condition loaded-zero identity or nonzero application. Broader scalar/explicit-NEON trajectories, writer authoring basis, quality, performance and full context remain pending.',
            'A selected-backend smoke cannot be split into repeated owner-device runs to bypass the aggregate five-minute budget.',
              'No default or admission change is authorized.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - name: Retain complete owner-job budget attribution
        if: always() && env.BONSAI_PTQ1_OWNER_BUDGET != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptq1-owner-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_PTQ1_OWNER_BUDGET }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded numerical evidence and failures
        if: always() && env.BONSAI_PTQ1_NUMERICS_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ptq1-numerics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/numerics.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/comparison.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/comparison.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/comparison.*.stdout
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/comparison.*.stderr
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/capture-tools.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/maintenance-tools.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-preflight/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-preflight/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-observations/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/abi-observations/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/native/*.native-seq
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/auto/state-0/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/scalar/state-0/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/*.json
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/*.txt
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/*.f32le
            ${{ env.BONSAI_PTQ1_NUMERICS_EVIDENCE }}/neon/state-0/*.f32le
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Retain only selected source-session timing evidence and failures
        if: always() && env.BONSAI_PTQ1_TIMING_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-ptq1-request-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing-owner.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/public-messages.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/capture-tools.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/maintenance-tools.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/request-timing-started.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/request-timing.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/supervision.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/arguments.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/artifacts.json
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/stdout.txt
            ${{ env.BONSAI_PTQ1_TIMING_EVIDENCE }}/request-timing/stderr.txt
          if-no-files-found: error
          retention-days: 90
