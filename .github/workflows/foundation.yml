name: Foundation
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.rumdl.toml'
      - '.github/workflows/markdown.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  # Checkout timestamps change on every runner. Reuse compiled Rust only when
  # Cargo verifies the source contents, while every check and test still runs.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
concurrency:
  # Superseded pushes retain cumulative coverage through the successful baseline.
  # Manual acceptance runs have independent groups and are never superseded.
  group: foundation-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      packages: ${{ steps.impact.outputs.packages }}
      rust_lanes: ${{ steps.impact.outputs.rust_lanes }}
      broker_checks: ${{ steps.impact.outputs.broker_checks }}
      maintenance: ${{ steps.impact.outputs.maintenance }}
      speech: ${{ steps.impact.outputs.speech }}
      speech_lanes: ${{ steps.impact.outputs.speech_lanes }}
      broker_lanes: ${{ steps.impact.outputs.broker_lanes }}
      integration: ${{ steps.impact.outputs.integration }}
      release: ${{ steps.impact.outputs.release }}
      tools: ${{ steps.impact.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the external Linux CI build path
        working-directory: ${{ runner.temp }}
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/SwiftBonsai-CI" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-11-09-aarch64-unknown-linux-gnu
          components: ''
      - name: Reuse compiled CI tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: ci-tool-v1-${{ runner.os }}-${{ runner.arch }}-nightly-2026-11-09-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/ci/**') }}
      - name: Check CI selection and gate regressions
        working-directory: ${{ runner.temp }}
        run: cargo +nightly-2026-11-09 test --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --package bonsai-ci
      - name: Select affected crates and app groups
        id: impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        working-directory: ${{ runner.temp }}
        run: cargo +nightly-2026-11-09 run --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --package bonsai-ci -- impact --workflow foundation.yml --before "$BEFORE" --after "$GITHUB_SHA"
      - name: Share the checked CI gate executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsai-ci-linux-arm64-${{ github.sha }}
          path: ${{ env.CARGO_TARGET_DIR }}/debug/bonsai-ci
          if-no-files-found: error
          compression-level: 1
  broker:
    name: broker / ${{ matrix.lane }}
    if: needs.changes.outputs.broker_checks == 'true'
    needs: changes
    runs-on: windows-11-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.broker_lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/check-rust
        with:
          lane: ${{ matrix.lane }}
          packages: ${{ matrix.lane == 'ui' && '["bonsai-chat"]' || '["bonsai-broker","bonsai-speech-service"]' }}
          affected: ${{ needs.changes.outputs.packages }}
  maintenance:
    if: needs.changes.outputs.maintenance == 'true'
    needs: changes
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the affected maintenance crates
        id: checks
        uses: ./.github/actions/check-rust
        with:
          lane: maintenance
          packages: '["bonsai-artifacts","bonsai-audio","bonsai-cpu-policy","bonsai-windows-process","bonsai-windows-credentials","bonsai-tools","bonsai-ci"]'
          affected: ${{ needs.changes.outputs.packages }}
      - name: Reuse a packaged CLI when only its consumers changed
        if: needs.changes.outputs.tools == 'true' && !contains(fromJSON(needs.changes.outputs.packages), 'bonsai-tools')
        uses: ./.github/actions/bonsai-tools
      - name: Stage the checked maintenance CLI and revision receipt
        if: needs.changes.outputs.tools == 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CheckedTools'
          [void][IO.Directory]::CreateDirectory($package)
          $tool = Join-Path $package 'bonsai-tools.exe'
          $builtTool = if ($env:BONSAI_TOOLS_PATH) { $env:BONSAI_TOOLS_PATH } else { Join-Path $env:CARGO_TARGET_DIR 'release/bonsai-tools.exe' }
          Copy-Item -LiteralPath $builtTool -Destination $tool
          $probe = Join-Path $package 'bonsai-completion-test-probe.exe'
          Copy-Item -LiteralPath (Join-Path (Split-Path -Parent $builtTool) 'bonsai-completion-test-probe.exe') -Destination $probe
          @{
            SchemaVersion = 2
            Revision = $env:GITHUB_SHA
            Sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
            ProbeSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'receipt.json')
      - name: Share the checked native Windows ARM64 maintenance CLI
        if: needs.changes.outputs.tools == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/SwiftBonsai-CheckedTools
          if-no-files-found: error
          compression-level: 1
  speech:
    name: speech / ${{ matrix.lane }}
    if: needs.changes.outputs.speech == 'true'
    needs: [changes, maintenance]
    runs-on: windows-11-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.speech_lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the current run's checked maintenance CLI for source provisioning
        uses: ./.github/actions/use-bonsai-tools
      - uses: ./.github/actions/check-rust
        with:
          lane: ${{ matrix.lane }}
          packages: ${{ matrix.lane == 'asr' && '["bonsai-speech-asr"]' || '["bonsai-speech-tts"]' }}
          affected: ${{ needs.changes.outputs.packages }}
  # Preserve the required check name; only the planner may authorize skips.
  foundation:
    if: always() && github.ref == 'refs/heads/main'
    needs: [changes, broker, maintenance, speech, foundation-tests, release-integration]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the CI executable checked by the planner job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bonsai-ci-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/SwiftBonsai-CI-Gate
      - name: Require every selected Foundation test group
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        working-directory: ${{ runner.temp }}
        run: |
          chmod +x "$RUNNER_TEMP/SwiftBonsai-CI-Gate/bonsai-ci"
          "$RUNNER_TEMP/SwiftBonsai-CI-Gate/bonsai-ci" gate --workflow foundation
  foundation-tests:
    name: Native integration
    if: needs.changes.outputs.integration == 'true'
    needs: [changes, maintenance]
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the checked maintenance CLI
        uses: ./.github/actions/use-bonsai-tools
      # Domain regressions (provisioning, builds, promotion and process ownership)
      # run as native Rust tests in the maintenance producer before this handoff.
      - name: Hexagon packed-layout and bounded inventory controls without devices
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B tools/hexagon/test_pq2_bridge.py
          python -B tools/hexagon/pq2_bridge.py
      - name: Released GGUF command integration
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Inference'
          $inference = & $env:BONSAI_TOOLS_PATH provision --json (@{ operation = 'inference'; dataDirectory = $data; includeCapabilities = $true } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($inference.CapabilityVerification.Status -cne 'verified' -or
              $inference.Capabilities.qualification -cne 'unqualified' -or
              $inference.Capabilities.runtime.target.architecture -cne 'aarch64') {
            throw 'Invalid verified released-runtime capability report.'
          }
          $evidence = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-GgufChecks'
          "BONSAI_GGUF_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $request = Join-Path $env:RUNNER_TEMP 'gguf-check-request.json'
          @{ operation = 'check'; ggufToolPath = $inference.Gguf; evidenceDirectory = $evidence; case = 'all' } |
            ConvertTo-Json | Set-Content -LiteralPath $request -Encoding utf8NoBOM
          & $env:BONSAI_TOOLS_PATH gguf --request $request
          if ($LASTEXITCODE -ne 0) { throw 'Native GGUF integration checks failed; inspect the retained fixture evidence.' }
      - name: Retain independent GGUF fixture evidence
        if: always() && env.BONSAI_GGUF_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gguf-integration-${{ github.sha }}
          path: ${{ env.BONSAI_GGUF_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 30
      - name: CPU admission diagnostics without model launch
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $result = & $env:BONSAI_TOOLS_PATH cpu-check --json (@{ dataDirectory = (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'); checkOnly = $true } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($result.ModelProcessStarted -or $result.AvailablePhysicalBytesAtAdmission -le 0) { throw 'Invalid admission-only result.' }
          $result | ConvertTo-Json
  release-integration:
    if: needs.changes.outputs.release == 'true'
    needs: [changes, maintenance]
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the checked maintenance CLI
        uses: ./.github/actions/use-bonsai-tools
      - name: Swift assessment policy and pinned ARM64 runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          $lockPath = Join-Path $env:GITHUB_WORKSPACE 'config/swift-assessment.lock.json'
          & $env:BONSAI_TOOLS_PATH provision --json (@{ operation = 'engine'; dataDirectory = $data; lockPath = $lockPath } | ConvertTo-Json -Compress)
          & $env:BONSAI_TOOLS_PATH provision --json (@{ operation = 'adapter'; dataDirectory = $data } | ConvertTo-Json -Compress)
          & $env:BONSAI_TOOLS_PATH provision --json (@{ operation = 'adapter'; dataDirectory = $data; verifyOnly = $true } | ConvertTo-Json -Compress)
          $result = & $env:BONSAI_TOOLS_PATH cpu-check --json (@{ dataDirectory = $data; profile = 'swift-pq2-assessment'; checkOnly = $true } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($result.ModelProcessStarted -or $result.RequiredAvailableBytes -ne 16642998272 -or
              $result.ServiceCeilingBytes -ne 12348030976 -or $result.AvailableMemoryFloorBytes -ne 4GB) { throw 'Invalid Swift admission-only result.' }
          $result | ConvertTo-Json
          $adapterCheck = & $env:BONSAI_TOOLS_PATH cpu-check --json (@{ dataDirectory = $data; profile = 'swift-pq2-assessment'; useAbliterateLora = $true; checkOnly = $true } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($adapterCheck.ModelProcessStarted -or -not $adapterCheck.AdapterRequested -or $adapterCheck.EstimatedAdapterBytes -ne 9682464) { throw 'Invalid explicit adapter admission-only result.' }
          $adapterCheck | ConvertTo-Json
          $ptqCheck = & $env:BONSAI_TOOLS_PATH cpu-check --json (@{ dataDirectory = $data; profile = 'swift-pq2-assessment'; useRepackedPtq1 = $true; checkOnly = $true } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($ptqCheck.ModelProcessStarted -or $ptqCheck.EstimatedWeightBytes -ne 5946648928 -or $ptqCheck.WeightRepresentation -cne 'current-repacked-PTQ1_0') { throw 'Invalid derived PTQ1 admission-only result.' }
      - name: Verify publisher ARM64 runtime and planned server switches
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          & $env:BONSAI_TOOLS_PATH provision --json (@{ operation = 'engine'; dataDirectory = $data } | ConvertTo-Json -Compress)
          $plan = & $env:BONSAI_TOOLS_PATH server-plan --json (@{ dataDirectory = $data; verification = 'runtime' } | ConvertTo-Json -Compress) | ConvertFrom-Json
          if ($plan.LaunchEnabled -or $plan.ModelProcessStarted -or
              $plan.RuntimeHelpVerification -notlike 'all-planned-switches-advertised*' -or
              $plan.ArtifactVerification -notlike '*model-not-checked') { throw 'Invalid runtime-only preflight result.' }
          $plan | Select-Object Status, ArtifactVerification, RuntimeHelpVerification | ConvertTo-Json
