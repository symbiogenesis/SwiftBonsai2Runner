name: Native chat app hosted candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - uses: ./.github/actions/rust-toolchain
        id: rust
        with:
          toolchain: nightly-2026-11-02-aarch64-pc-windows-msvc
      - name: Build exact native GUI and broker without launching either
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PINNED_TOOLCHAIN_PATH: ${{ steps.rust.outputs.toolchain-path }}
          CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
          CARGO_BUILD_FINGERPRINT: content
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = Join-Path $env:RUNNER_TEMP ('Bonsai-NativeChatCandidate-' + [guid]::NewGuid().ToString('N'))
          & $env:BONSAI_TOOLS_PATH build-tools --json (@{ operation = 'chat-candidate'; repositoryRoot = $env:GITHUB_WORKSPACE; outputDirectory = $output } | ConvertTo-Json -Compress)
      - name: Retain exact native chat candidate binaries and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-chat-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_CHAT_CANDIDATE_PACKAGE }}/bonsai-chat.exe
            ${{ env.BONSAI_CHAT_CANDIDATE_PACKAGE }}/bonsai-broker.exe
            ${{ env.BONSAI_CHAT_CANDIDATE_PACKAGE }}/bonsai-tools.exe
            ${{ env.BONSAI_CHAT_CANDIDATE_PACKAGE }}/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded public-source build evidence
        if: always() && env.BONSAI_CHAT_CANDIDATE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-chat-candidate-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_CHAT_CANDIDATE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
