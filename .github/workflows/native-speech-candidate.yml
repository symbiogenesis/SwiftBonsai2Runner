name: Native speech hosted candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - uses: ./.github/actions/rust-toolchain
        id: rust
        with:
          toolchain: nightly-2026-11-09-aarch64-pc-windows-msvc
      - name: Build both speech companions without fetching or loading model weights
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PINNED_TOOLCHAIN_PATH: ${{ steps.rust.outputs.toolchain-path }}
          BONSAI_SPEECH_SOURCE_ID: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'src/**', 'tools/bonsai/**', 'config/**') }}
          CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
          CARGO_BUILD_FINGERPRINT: content
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN', 'RUSTC', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'CARGO_BUILD_RUSTC', 'CARGO_BUILD_RUSTC_WRAPPER', 'CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER')) {
            Remove-Item -LiteralPath ('Env:' + $name) -ErrorAction SilentlyContinue
          }
          $output = Join-Path $env:RUNNER_TEMP ('Bonsai-NativeSpeechCandidate-' + [guid]::NewGuid().ToString('N'))
          & $env:BONSAI_TOOLS_PATH build-tools --json (@{ operation = 'speech-candidate'; repositoryRoot = $env:GITHUB_WORKSPACE; outputDirectory = $output } | ConvertTo-Json -Compress)
      - name: Retain exact speech candidate binaries and source receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-speech-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/bonsai-speech-asr.exe
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/bonsai-speech-tts.exe
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/native-build-receipt.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/native-build-result.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/native-speech.lock.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/source-inputs.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded public-source speech build evidence
        if: always() && env.BONSAI_SPEECH_CANDIDATE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-speech-candidate-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_SPEECH_CANDIDATE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
