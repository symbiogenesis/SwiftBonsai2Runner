name: X2 native Rust queued computation
on:
  push:
    branches: [main, 'codex/hexagon-**']
    paths:
      - .github/workflows/hexagon-x2-compute.yml
      - .github/workflows/hexagon-windows-abi.yml
      - tools/hexagon/**
      - scripts/*Hexagon*
      - tests/Test-HexagonCompute.ps1
      - tests/Test-HexagonSession.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi:
    uses: ./.github/workflows/hexagon-windows-abi.yml
  controls:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Check computation evidence, cancellation contracts and packed preparation without a device
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($case in @('Plan','Result')) { ./tests/Test-HexagonCompute.ps1 -Case $case }
          foreach ($case in @('Plan','Build','Result','Environment')) { ./tests/Test-HexagonSession.ps1 -Case $case }
          ./tests/Test-NativeProcess.ps1 -Case OwnedExitAccounting
      - name: Build source-bound native fixture and run independent packed and queue contracts
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-HexagonDispatch.ps1') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-X2-Compute') | ConvertTo-Json -Depth 5
      - name: Retain the exact native fixture for separately budgeted owner intake
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hexagon-x2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-X2-Compute/native-rpc-bundle
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded model-free native and packed results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hexagon-x2-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/SwiftBonsai-X2-Compute/native-rpc
            ${{ runner.temp }}/SwiftBonsai-X2-Compute/packed-projection
          if-no-files-found: warn
          retention-days: 90
