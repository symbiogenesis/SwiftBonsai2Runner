name: X2 native Rust queued computation
on:
  push:
    branches: [main, 'codex/hexagon-**']
    paths:
      - .github/workflows/hexagon-x2-compute.yml
      - .github/workflows/hexagon-windows-abi.yml
      - tools/hexagon/**
      - tools/bonsai/src/hexagon_tools*
      - tools/bonsai/src/hexagon_tools/**
      - src/windows-process/**
      - tools/bonsai/src/hexagon_policy/**
      - tools/bonsai/tests/fixtures/hexagon-*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abi:
    uses: ./.github/workflows/hexagon-windows-abi.yml
  controls:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - uses: ./.github/actions/bonsai-tools
      - name: Check native Hexagon evidence policy without opening a device
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --locked --release --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-tools --all-features --target-dir $env:BONSAI_TOOLS_TARGET --lib hexagon_
      - name: Stage the current source-bound policy executable
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-HexagonPolicy'
          [void][IO.Directory]::CreateDirectory($package)
          $tool = Join-Path $package 'bonsai-tools.exe'
          $probe = Join-Path $package 'bonsai-completion-test-probe.exe'
          Copy-Item -LiteralPath $env:BONSAI_TOOLS_PATH -Destination $tool
          Copy-Item -LiteralPath $env:BONSAI_COMPLETION_PROBE_PATH -Destination $probe
          @{
            SchemaVersion = 2; Revision = $env:GITHUB_SHA
            Sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
            ProbeSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'receipt.json')
      - name: Share the checked policy executable for bounded same-run intake
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/SwiftBonsai-HexagonPolicy
          if-no-files-found: error
          retention-days: 90
      - name: Build source-bound native fixture and run independent packed and queue contracts
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @{ operation = 'build-dispatch'; repositoryDirectory = $env:GITHUB_WORKSPACE; outputDirectory = (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-X2-Compute') } | ConvertTo-Json -Compress | & $env:BONSAI_TOOLS_PATH hexagon-tools --request -
      - name: Retain the exact native fixture for separately budgeted owner intake
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hexagon-x2-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-X2-Compute/native-rpc-bundle
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded model-free native and packed results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hexagon-x2-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/SwiftBonsai-X2-Compute/native-rpc
            ${{ runner.temp }}/SwiftBonsai-X2-Compute/packed-projection
          if-no-files-found: warn
          retention-days: 90
