[package]
name = "bonsai-sdk-reader"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Bounded data-only Hexagon SDK archive stream"

[workspace]

[dependencies]
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"] }
tar = { version = "=0.4.44", default-features = false }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
unicode-casefold = "=0.2.0"

[profile.release]
overflow-checks = true
debug-assertions = false
