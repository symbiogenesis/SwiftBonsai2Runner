[package]
name = "bonsai-tools"
default-run = "bonsai-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Packaged Windows supervision, credentials and qualification tooling"
repository.workspace = true
keywords = ["ternary", "quantization", "scalar"]
categories = ["encoding", "science"]

[[bin]]
name = "bonsai-tools"
path = "src/main.rs"
# Exercise the CLI through integration tests without linking an empty harness.
test = false

[[bin]]
name = "bonsai-launcher"
path = "src/launcher.rs"
test = false

[features]
test-probe = []

[[bin]]
name = "bonsai-completion-test-probe"
path = "tests/support/completion_probe.rs"
required-features = ["test-probe"]
test = false
doc = false

[dependencies]
bonsai-artifacts.workspace = true
bonsai-audio.workspace = true
bonsai-cpu-policy.workspace = true
httparse.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
bonsai-windows-process.workspace = true
bonsai-windows-credentials.workspace = true

[target.'cfg(not(windows))'.dependencies]
sha2.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
