[package]
name = "bonsai-tools"
default-run = "bonsai-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Packaged Windows supervision, credentials and qualification tooling"
repository.workspace = true
keywords = ["ternary", "quantization", "scalar"]
categories = ["encoding", "science"]

[[bin]]
name = "bonsai-tools"
path = "src/main.rs"
# Exercise the CLI through integration tests without linking an empty harness.
test = false

[[bin]]
name = "bonsai-launcher"
path = "src/launcher.rs"
test = false

[[bin]]
name = "bonsai-reference-numerics"
path = "../native-reference/reference_numerics.rs"
test = false

[[bin]]
name = "bonsai-assets"
path = "src/application_icon.rs"

[features]
test-probe = []

[[bin]]
name = "bonsai-completion-test-probe"
path = "tests/support/completion_probe.rs"
required-features = ["test-probe"]
test = false
doc = false

[[bin]]
name = "bonsai-release-test-probe"
path = "tests/support/release_probe.rs"
required-features = ["test-probe"]
test = false
doc = false

[dependencies]
bonsai-artifacts.workspace = true
bonsai-audio.workspace = true
bonsai-cpu-policy.workspace = true
flate2.workspace = true
httparse.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
bonsai-windows-process.workspace = true
bonsai-windows-credentials.workspace = true
# Use Schannel/system trust without compiling a bundled root certificate set.
ureq = { workspace = true, features = ["native-tls-no-default"] }

[target.'cfg(not(windows))'.dependencies]
sha2.workspace = true
ureq = { workspace = true, features = ["rustls"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
